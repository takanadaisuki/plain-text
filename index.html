<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>逆再生＆ローマ字変換</title>

<style>
body {
  font-family: sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 20px;
  background: #f5f5f5;
}

h1 {
  text-align: center;
}

section {
  background: white;
  padding: 20px;
  margin: 20px 0;
  border-radius: 15px;
}

button {
  padding: 12px 18px;
  margin: 5px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #333;
  color: white;
}

button:disabled {
  background: #aaa;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  font-size: 20px;
  border: 1px solid #ccc;
  border-radius: 10px;
}

audio {
  width: 100%;
  margin-top: 10px;
}

.result {
  font-size: 24px;
  font-weight: bold;
  word-break: break-all;
  margin: 10px 0 20px;
}

.status {
  margin: 15px 0;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎙️ 逆再生＆ローマ字変換</h1>


<!-- =========================
     音声録音
========================= -->

<section>

<h2>🎤 音声録音</h2>

<button id="startButton">
録音開始
</button>

<button id="stopButton" disabled>
録音停止
</button>

<div id="status" class="status">
待機中
</div>

<p>通常再生</p>

<audio id="normalAudio" controls></audio>


<p>逆再生</p>

<audio id="reverseAudio" controls></audio>

<br>

<button id="downloadButton" disabled>
逆再生を保存
</button>

</section>



<!-- =========================
     ローマ字変換
========================= -->

<section>

<h2>🔤 ローマ字変換</h2>

<input
  id="textInput"
  type="text"
  placeholder="ひらがなを入力"
>

<p>ローマ字</p>

<div id="romanResult" class="result">
---
</div>


<p>逆から</p>

<div id="reverseRomanResult" class="result">
---
</div>

</section>



<script>

/* ==================================================
   音声録音
================================================== */

let recorder = null;
let chunks = [];
let normalBlob = null;
let reverseBlob = null;

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const status =
  document.getElementById("status");

const normalAudio =
  document.getElementById("normalAudio");

const reverseAudio =
  document.getElementById("reverseAudio");

const downloadButton =
  document.getElementById("downloadButton");


/* 録音開始 */

startButton.addEventListener("click", async () => {

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      alert(
        "このブラウザではマイクが使用できません。Safariで開いてください。"
      );

      return;
    }


    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });


    chunks = [];


    recorder =
      new MediaRecorder(stream);


    recorder.ondataavailable = (event) => {

      if (event.data.size > 0) {
        chunks.push(event.data);
      }

    };


    recorder.onstop = async () => {

      status.textContent =
        "音声を処理しています…";


      normalBlob =
        new Blob(chunks, {
          type: recorder.mimeType
        });


      normalAudio.src =
        URL.createObjectURL(normalBlob);


      try {

        reverseBlob =
          await makeReverseAudio(normalBlob);

        reverseAudio.src =
          URL.createObjectURL(reverseBlob);

        downloadButton.disabled = false;

        status.textContent =
          "録音完了！";

      } catch (error) {

        console.error(error);

        status.textContent =
          "逆再生の作成に失敗しました。";

      }


      /* マイクを停止 */

      stream.getTracks().forEach(track => {
        track.stop();
      });

    };


    recorder.start();


    startButton.disabled = true;
    stopButton.disabled = false;

    status.textContent =
      "🔴 録音中…";


  } catch (error) {

    console.error(error);

    alert(
      "マイクへのアクセスが許可されていません。\n\n" +
      "iPhoneの設定 → Safari → マイク → 許可\n" +
      "を確認してください。"
    );

  }

});


/* 録音停止 */

stopButton.addEventListener("click", () => {

  if (recorder &&
      recorder.state === "recording") {

    recorder.stop();

  }

  startButton.disabled = false;
  stopButton.disabled = true;

});



/* ==================================================
   音声を逆向きにする
================================================== */

async function makeReverseAudio(blob) {

  const arrayBuffer =
    await blob.arrayBuffer();


  const audioContext =
    new AudioContext();


  const audioBuffer =
    await audioContext.decodeAudioData(
      arrayBuffer
    );


  const reversedBuffer =
    audioContext.createBuffer(
      audioBuffer.numberOfChannels,
      audioBuffer.length,
      audioBuffer.sampleRate
    );


  for (
    let channel = 0;
    channel < audioBuffer.numberOfChannels;
    channel++
  ) {

    const original =
      audioBuffer.getChannelData(channel);

    const reversed =
      reversedBuffer.getChannelData(channel);


    for (
      let i = 0;
      i < original.length;
      i++
    ) {

      reversed[i] =
        original[original.length - 1 - i];

    }

  }


  return convertToWav(reversedBuffer);

}



/* ==================================================
   WAVに変換
================================================== */

function convertToWav(buffer) {

  const channels =
    buffer.numberOfChannels;

  const sampleRate =
    buffer.sampleRate;

  const length =
    buffer.length;

  const bitDepth = 16;

  const bytesPerSample =
    bitDepth / 8;

  const dataSize =
    length *
    channels *
    bytesPerSample;


  const arrayBuffer =
    new ArrayBuffer(
      44 + dataSize
    );


  const view =
    new DataView(arrayBuffer);


  function writeString(offset, text) {

    for (
      let i = 0;
      i < text.length;
      i++
    ) {

      view.setUint8(
        offset + i,
        text.charCodeAt(i)
      );

    }

  }


  writeString(0, "RIFF");

  view.setUint32(
    4,
    36 + dataSize,
    true
  );

  writeString(8, "WAVE");

  writeString(12, "fmt ");

  view.setUint32(
    16,
    16,
    true
  );

  view.setUint16(
    20,
    1,
    true
  );

  view.setUint16(
    22,
    channels,
    true
  );

  view.setUint32(
    24,
    sampleRate,
    true
  );

  view.setUint32(
    28,
    sampleRate *
    channels *
    bytesPerSample,
    true
  );

  view.setUint16(
    32,
    channels *
    bytesPerSample,
    true
  );

  view.setUint16(
    34,
    bitDepth,
    true
  );

  writeString(36, "data");

  view.setUint32(
    40,
    dataSize,
    true
  );


  let offset = 44;


  for (
    let i = 0;
    i < length;
    i++
  ) {

    for (
      let channel = 0;
      channel < channels;
      channel++
    ) {

      let sample =
        buffer.getChannelData(channel)[i];


      sample =
        Math.max(
          -1,
          Math.min(1, sample)
        );


      view.setInt16(
        offset,
        sample < 0
          ? sample * 0x8000
          : sample * 0x7FFF,
        true
      );


      offset += 2;

    }

  }


  return new Blob(
    [arrayBuffer],
    { type: "audio/wav" }
  );

}



/* ==================================================
   逆再生音声を保存
================================================== */

downloadButton.addEventListener(
  "click",
  () => {

    if (!reverseBlob) {
      return;
    }


    const url =
      URL.createObjectURL(reverseBlob);


    const link =
      document.createElement("a");


    link.href = url;

    link.download =
      "reverse-voice.wav";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

  }
);



/* ==================================================
   ひらがな → ローマ字
================================================== */

const kana = {

"あ":"a","い":"i","う":"u","え":"e","お":"o",

"か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",

"さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",

"た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to",

"な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no",

"は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho",

"ま":"ma","み":"mi","む":"mu","め":"me","も":"mo",

"や":"ya","ゆ":"yu","よ":"yo",

"ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro",

"わ":"wa","を":"wo",

"ん":"n",

"が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go",

"ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo",

"だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do",

"ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",

"ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po"

};


const combinations = {

"きゃ":"kya","きゅ":"kyu","きょ":"kyo",

"しゃ":"sha","しゅ":"shu","しょ":"sho",

"ちゃ":"cha","ちゅ":"chu","ちょ":"cho",

"にゃ":"nya","にゅ":"nyu","にょ":"nyo",

"ひゃ":"hya","ひゅ":"hyu","ひょ":"hyo",

"みゃ":"mya","みゅ":"myu","みょ":"myo",

"りゃ":"rya","りゅ":"ryu","りょ":"ryo",

"ぎゃ":"gya","ぎゅ":"gyu","ぎょ":"gyo",

"じゃ":"ja","じゅ":"ju","じょ":"jo",

"びゃ":"bya","びゅ":"byu","びょ":"byo",

"ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo"

};



function convertHiragana(text) {

  let result = "";

  let i = 0;


  while (i < text.length) {


    /* 拗音 */

    const pair =
      text.substring(i, i + 2);


    if (combinations[pair]) {

      result +=
        combinations[pair];

      i += 2;

      continue;

    }


    /* 促音「っ」 */

    if (text[i] === "っ") {

      const nextPair =
        text.substring(i + 1, i + 3);


      if (combinations[nextPair]) {

        result +=
          combinations[nextPair][0];

      } else {

        const next =
          kana[text[i + 1]];

        if (next) {
          result += next[0];
        }

      }

      i++;

      continue;

    }


    /* ー */

    if (text[i] === "ー") {

      i++;

      continue;

    }


    /* 通常文字 */

    if (kana[text[i]]) {

      result += kana[text[i]];

    } else {

      result += text[i];

    }


    i++;

  }


  return result;

}



/* ==================================================
   入力した瞬間に変換
================================================== */

const textInput =
  document.getElementById("textInput");

const romanResult =
  document.getElementById("romanResult");

const reverseRomanResult =
  document.getElementById(
    "reverseRomanResult"
  );


textInput.addEventListener(
  "input",
  () => {

    const text =
      textInput.value;


    const roman =
      convertHiragana(text);


    const reversed =
      roman
        .split("")
        .reverse()
        .join("");


    romanResult.textContent =
      roman || "---";


    reverseRomanResult.textContent =
      reversed || "---";

  }
);

</script>

</body>
</html>
