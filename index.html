<h1>🎙️ 逆再生セリフ作成用</h1>

<h2>🎤 音声を逆再生</h2>

<button id="start">録音開始</button>

<button id="stop" disabled>録音停止</button>

<p id="status">待機中</p>

<audio id="normalAudio" controls></audio>

<br><br>

<audio id="reverseAudio" controls></audio>

<br>

<button id="download" disabled>

逆再生音声をダウンロード

</button>

    コピー

/* ==================================================

   録音

================================================== */

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

const startButton =

  document.getElementById("start");

const stopButton =

  document.getElementById("stop");

const statusText =

  document.getElementById("status");

const normalAudio =

  document.getElementById("normalAudio");

const reverseAudio =

  document.getElementById("reverseAudio");

const downloadButton =

  document.getElementById("download");

startButton.addEventListener("click", async () => {

  try {

    const stream =

      await navigator.mediaDevices.getUserMedia({

        audio: true

      });

    audioChunks = [];

    let options = {};

    if (

      MediaRecorder.isTypeSupported(

        "audio/webm;codecs=opus"

      )

    ) {

      options = {

        mimeType:

          "audio/webm;codecs=opus"

      };

    } else if (

      MediaRecorder.isTypeSupported(

        "audio/mp4"

      )

    ) {

      options = {

        mimeType: "audio/mp4"

      };

    }

    mediaRecorder =

      new MediaRecorder(

        stream,

        options

      );

    mediaRecorder.ondataavailable =

      event => {

        if (event.data.size > 0) {

          audioChunks.push(

            event.data

          );

        }

      };

    mediaRecorder.onstop =

      async () => {

        audioBlob =

          new Blob(

            audioChunks,

            {

              type:

                mediaRecorder.mimeType

            }

          );

        normalAudio.src =

          URL.createObjectURL(

            audioBlob

          );

        try {

          await createReverseAudio(

            audioBlob

          );

          statusText.textContent =

            "録音完了";

        } catch (error) {

          console.error(error);

          statusText.textContent =

            "逆再生音声を作成できませんでした。";

        }

        stream

          .getTracks()

          .forEach(

            track => track.stop()

          );

      };

    mediaRecorder.start();

    startButton.disabled = true;

    stopButton.disabled = false;

    statusText.textContent =

      "🔴 録音中...";

  } catch (error) {

    console.error(error);

    statusText.textContent =

      "マイクを使用できませんでした。";

  }

});

stopButton.addEventListener("click", () => {

  if (

    mediaRecorder &&

    mediaRecorder.state !== "inactive"

  ) {

    mediaRecorder.stop();

    startButton.disabled = false;

    stopButton.disabled = true;

    statusText.textContent =

      "処理中...";

  }

});

/* ==================================================

   音声を逆再生

================================================== */

async function createReverseAudio(blob) {

  const arrayBuffer =

    await blob.arrayBuffer();

  const AudioContext =

    window.AudioContext ||

    window.webkitAudioContext;

  const audioContext =

    new AudioContext();

  const audioBuffer =

    await audioContext.decodeAudioData(

      arrayBuffer

    );

  const reversedBuffer =

    audioContext.createBuffer(

      audioBuffer.numberOfChannels,

      audioBuffer.length,

      audioBuffer.sampleRate

    );

  for (

    let channel = 0;

    channel < audioBuffer.numberOfChannels;

    channel++

  ) {

    const original =

      audioBuffer.getChannelData(

        channel

      );

    const reversed =

      reversedBuffer.getChannelData(

        channel

      );

    for (

      let i = 0;

      i < original.length;

      i++

    ) {

      reversed[i] =

        original[

          original.length - 1 - i

        ];

    }

  }

  const wavBlob =

    audioBufferToWav(

      reversedBuffer

    );

  reverseAudio.src =

    URL.createObjectURL(

      wavBlob

    );

  downloadButton.disabled = false;

  downloadButton.onclick = () => {

    const url =

      URL.createObjectURL(

        wavBlob

      );

    const a =

      document.createElement("a");

    a.href = url;

    a.download =

      "reverse.wav";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    setTimeout(() => {

      URL.revokeObjectURL(url);

    }, 1000);

  };

}

/* ==================================================

   WAV作成

================================================== */

function audioBufferToWav(buffer) {

  const numChannels =

    buffer.numberOfChannels;

  const sampleRate =

    buffer.sampleRate;

  const bitDepth = 16;

  const blockAlign =

    numChannels *

    bitDepth /

    8;

  const byteRate =

    sampleRate *

    blockAlign;

  const dataSize =

    buffer.length *

    blockAlign;

  const arrayBuffer =

    new ArrayBuffer(

      44 + dataSize

    );

  const view =

    new DataView(

      arrayBuffer

    );

  function writeString(

    offset,

    string

  ) {

    for (

      let i = 0;

      i < string.length;

      i++

    ) {

      view.setUint8(

        offset + i,

        string.charCodeAt(i)

      );

    }

  }

  writeString(

    0,

    "RIFF"

  );

  view.setUint32(

    4,

    36 + dataSize,

    true

  );

  writeString(

    8,

    "WAVE"

  );

  writeString(

    12,

    "fmt "

  );

  view.setUint32(

    16,

    16,

    true

  );

  view.setUint16(

    20,

    1,

    true

  );

  view.setUint16(

    22,

    numChannels,

    true

  );

  view.setUint32(

    24,

    sampleRate,

    true

  );

  view.setUint32(

    28,

    byteRate,

    true

  );

  view.setUint16(

    32,

    blockAlign,

    true

  );

  view.setUint16(

    34,

    bitDepth,

    true

  );

  writeString(

    36,

    "data"

  );

  view.setUint32(

    40,

    dataSize,

    true

  );

  let offset = 44;

  for (

    let i = 0;

    i < buffer.length;

    i++

  ) {

    for (

      let channel = 0;

      channel < numChannels;

      channel++

    ) {

      let sample =

        buffer.getChannelData(

          channel

        )[i];

      sample =

        Math.max(

          -1,

          Math.min(

            1,

            sample

          )

        );

      view.setInt16(

        offset,

        sample < 0

          ? sample * 0x8000

          : sample * 0x7FFF,

        true

      );

      offset += 2;

    }

  }

  return new Blob(

    [arrayBuffer],

    {

      type: "audio/wav"

    }

  );

}

/* ==================================================

   ひらがな → ローマ字

================================================== */

function hiraganaToRomaji(text) {

  let result = "";

  let i = 0;

  while (

    i < text.length

  ) {

    const two =

      text.substring(

        i,

        i + 2

      );

    if (

      kanaMap[two]

    ) {

      result +=

        kanaMap[two];

      i += 2;

      continue;

    }

    const one =

      text[i];

    if (

      kanaMap[one]

    ) {

      result +=

        kanaMap[one];

    } else {

      result +=

        one;

    }

    i++;

  }

  return result;

}

/* ==================================================

   ローマ字 → 逆順

================================================== */

function reverseRomaji(text) {

  return text

    .split("")

    .reverse()

    .join("");

}

/* ==================================================

   ここが今回の重要部分

================================================== */

function romajiToHiragana(text) {

  /*

    動的計画法で

    「どこまで読めるか」を探索する。

  */

  const memo = {};

  function solve(position) {

    if (

      position >= text.length

    ) {

      return {

        text: "",

        length: 0,

        complete: true

      };

    }

    if (

      memo[position]

    ) {

      return memo[position];

    }

    let best = null;

    /*

      長い候補から確認

    */

    for (

      let length = 3;

      length >= 1;

      length--

    ) {

      const part =

        text.substring(

          position,

          position + length

        );

      if (

        !romajiMap[part]

      ) {

        continue;

      }

      const next =

        solve(

          position + length

        );

      /*

        最後まで読めるルートを優先

      */

      if (

        next.complete

      ) {

        best = {

          text:

            romajiMap[part] +

            next.text,

          length:

            length +

            next.length,

          complete:

            true

        };

        break;

      }

      /*

        最後まで読めない場合でも、

        最も長く読めるルートを保存

      */

      if (

        best === null ||

        length + next.length >

        best.length

      ) {

        best = {

          text:

            romajiMap[part] +

            next.text,

          length:

            length +

            next.length,

          complete:

            false

        };

      }

    }

    if (

      best === null

    ) {

      best = {

        text: "",

        length: 0,

        complete: false

      };

    }

    memo[position] =

      best;

    return best;

  }

  const result =

    solve(0);

  return {

    text:

      result.text,

    complete:

      result.complete

  };

}

const kanaInput =

    "kanaInput"

  );

    "romajiResult"

  );

const reverseResult =

  document.getElementById(

  );

const hiraganaResult =

  document.getElementById(

    "hiraganaResult"

  );

const warning =

  document.getElementById(

    "warning"

  );

kanaInput.addEventListener(

  "input",

  () => {

    const input =

      kanaInput.value;

    /*

      ひらがな

      ↓

      ローマ字

    */

    const romaji =

      hiraganaToRomaji(

        input

      );

    /*

      ローマ字

      ↓

      逆順

    */

    const reversed =

      reverseRomaji(

        romaji

      );

    /*

      逆ローマ字

      ↓

      ひらがな

    */

    const converted =

      romajiToHiragana(

        reversed

      );

    romajiResult.textContent =

      romaji;

    reverseResult.textContent =

      reversed;

    hiraganaResult.textContent =

      converted.text;

    if (

      converted.complete

    ) {

      warning.textContent =

        "";

    } else {

      warning.textContent =

        "注意：表記不可の文字があります。";

    }

  }

);

/* ==================================================

   コピー

================================================== */

function copyText(id) {

  const element =

    document.getElementById(id);

  const text =

    element.textContent;

  if (

    navigator.clipboard

  ) {

    navigator.clipboard.writeText(

      text

    );

  } else {

    const textarea =

      document.createElement(

        "textarea"

      );

    textarea.value =

      text;

    document.body.appendChild(

      textarea

    );

    textarea.select();

    document.execCommand(

      "copy"

    );

    document.body.removeChild(

      textarea

    );

  }

}
