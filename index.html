<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>逆再生＆ローマ字変換</title>

  <style>

    body {

      font-family: sans-serif;

      max-width: 600px;

      margin: 0 auto;

      padding: 20px;

      text-align: center;

      background: #f7f7f7;

    }

    h1 {

      margin-bottom: 30px;

    }

    section {

      background: white;

      padding: 20px;

      margin-bottom: 20px;

      border-radius: 12px;

      box-shadow: 0 2px 8px rgba(0,0,0,0.08);

    }

    button {

      font-size: 16px;

      padding: 12px 18px;

      margin: 5px;

      border: none;

      border-radius: 8px;

      background: #333;

      color: white;

      cursor: pointer;

    }

    button:disabled {

      background: #aaa;

    }

    input {

      width: 90%;

      padding: 12px;

      font-size: 18px;

      border: 1px solid #ccc;

      border-radius: 8px;

      margin-bottom: 15px;

    }

    .result {

      font-size: 22px;

      font-weight: bold;

      margin: 10px 0;

      word-break: break-all;

    }

    audio {

      width: 100%;

      margin-top: 10px;

    }

    .label {

      font-size: 14px;

      color: #666;

      margin-top: 15px;

    }

  </style>

</head>

<body>

  <h1>🎙️ 逆再生＆ローマ字変換</h1>

  <!-- 音声録音 -->

  <section>

    <h2>🎤 音声録音</h2>

    <button id="startBtn">録音開始</button>

    <button id="stopBtn" disabled>録音停止</button>

    <div id="status">待機中</div>

    <div class="label">通常再生</div>

    <audio id="normalAudio" controls></audio>

    <div class="label">逆再生</div>

    <audio id="reverseAudio" controls></audio>

    <br>

    <button id="downloadBtn" disabled>

      逆再生音声を保存

    </button>

  </section>

  <!-- ローマ字変換 -->

  <section>

    <h2>🔤 ローマ字逆変換</h2>

    <input

      id="textInput"

      type="text"

      placeholder="ひらがなを入力"

    >

    <div class="label">ローマ字</div>

    <div id="romanResult" class="result">---</div>

    <div class="label">逆から</div>

    <div id="reverseRomanResult" class="result">---</div>

  </section>

<script>

  /* =========================

     音声録音

  ========================= */

  let mediaRecorder;

  let audioChunks = [];

  let recordedBlob = null;

  let reversedBlob = null;

  const startBtn = document.getElementById("startBtn");

  const stopBtn = document.getElementById("stopBtn");

  const status = document.getElementById("status");

  const normalAudio = document.getElementById("normalAudio");

  const reverseAudio = document.getElementById("reverseAudio");

  const downloadBtn = document.getElementById("downloadBtn");

  startBtn.addEventListener("click", async () => {

    try {

      const stream = await navigator.mediaDevices.getUserMedia({

        audio: true

      });

      mediaRecorder = new MediaRecorder(stream);

      audioChunks = [];

      mediaRecorder.ondataavailable = event => {

        audioChunks.push(event.data);

      };

      mediaRecorder.onstop = async () => {

        const blob = new Blob(audioChunks, {

          type: "audio/webm"

        });

        recordedBlob = blob;

        normalAudio.src = URL.createObjectURL(blob);

        status.textContent = "逆再生音声を作成中...";

        reversedBlob = await reverseAudio(blob);

        reverseAudio.src = URL.createObjectURL(reversedBlob);

        downloadBtn.disabled = false;

        status.textContent = "録音完了！";

      };

      mediaRecorder.start();

      startBtn.disabled = true;

      stopBtn.disabled = false;

      status.textContent = "録音中...";

    } catch (error) {

      status.textContent =

        "マイクを使用できませんでした。";

      console.error(error);

    }

  });

  stopBtn.addEventListener("click", () => {

    mediaRecorder.stop();

    startBtn.disabled = false;

    stopBtn.disabled = true;

    status.textContent = "処理中...";

  });

  /* =========================

     音声を逆再生用に反転

  ========================= */

  async function reverseAudio(blob) {

    const arrayBuffer = await blob.arrayBuffer();

    const audioContext = new AudioContext();

    const audioBuffer =

      await audioContext.decodeAudioData(arrayBuffer);

    const reversedBuffer =

      audioContext.createBuffer(

        audioBuffer.numberOfChannels,

        audioBuffer.length,

        audioBuffer.sampleRate

      );

    for (

      let channel = 0;

      channel < audioBuffer.numberOfChannels;

      channel++

    ) {

      const original =

        audioBuffer.getChannelData(channel);

      const reversed =

        reversedBuffer.getChannelData(channel);

      for (

        let i = 0;

        i < original.length;

        i++

      ) {

        reversed[i] =

          original[original.length - 1 - i];

      }

    }

    return audioBufferToWav(reversedBuffer);

  }

  /* =========================

     WAV変換

  ========================= */

  function audioBufferToWav(buffer) {

    const numChannels = buffer.numberOfChannels;

    const sampleRate = buffer.sampleRate;

    const format = 1;

    const bitDepth = 16;

    const samples = buffer.length;

    const blockAlign =

      numChannels * bitDepth / 8;

    const byteRate =

      sampleRate * blockAlign;

    const dataSize =

      samples * blockAlign;

    const arrayBuffer =

      new ArrayBuffer(44 + dataSize);

    const view =

      new DataView(arrayBuffer);

    function writeString(offset, string) {

      for (let i = 0; i < string.length; i++) {

        view.setUint8(

          offset + i,

          string.charCodeAt(i)

        );

      }

    }

    writeString(0, "RIFF");

    view.setUint32(

      4,

      36 + dataSize,

      true

    );

    writeString(8, "WAVE");

    writeString(12, "fmt ");

    view.setUint32(16, 16, true);

    view.setUint16(20, format, true);

    view.setUint16(22, numChannels, true);

    view.setUint32(

      24,

      sampleRate,

      true

    );

    view.setUint32(

      28,

      byteRate,

      true

    );

    view.setUint16(

      32,

      blockAlign,

      true

    );

    view.setUint16(

      34,

      bitDepth,

      true

    );

    writeString(36, "data");

    view.setUint32(

      40,

      dataSize,

      true

    );

    let offset = 44;

    for (let i = 0; i < samples; i++) {

      for (

        let channel = 0;

        channel < numChannels;

        channel++

      ) {

        let sample =

          buffer.getChannelData(channel)[i];

        sample =

          Math.max(-1, Math.min(1, sample));

        view.setInt16(

          offset,

          sample < 0

            ? sample * 0x8000

            : sample * 0x7FFF,

          true

        );

        offset += 2;

      }

    }

    return new Blob(

      [arrayBuffer],

      { type: "audio/wav" }

    );

  }

  /* =========================

     ダウンロード

  ========================= */

  downloadBtn.addEventListener("click", () => {

    if (!reversedBlob) return;

    const url =

      URL.createObjectURL(reversedBlob);

    const a =

      document.createElement("a");

    a.href = url;

    a.download = "reverse-voice.wav";

    a.click();

    URL.revokeObjectURL(url);

  });

  /* =========================

     ひらがな → ローマ字

  ========================= */

  const kanaMap = {

    "あ":"a","い":"i","う":"u","え":"e","お":"o",

    "か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",

    "さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",

    "た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to",

    "な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no",

    "は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho",

    "ま":"ma","み":"mi","む":"mu","め":"me","も":"mo",

    "や":"ya","ゆ":"yu","よ":"yo",

    "ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro",

    "わ":"wa","を":"wo",

    "ん":"n",

    "が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go",

    "ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo",

    "だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do",

    "ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",

    "ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po",

    "ゃ":"ya","ゅ":"yu","ょ":"yo"

  };

  const combinationMap = {

    "きゃ":"kya","きゅ":"kyu","きょ":"kyo",

    "しゃ":"sha","しゅ":"shu","しょ":"sho",

    "ちゃ":"cha","ちゅ":"chu","ちょ":"cho",

    "にゃ":"nya","にゅ":"nyu","にょ":"nyo",

    "ひゃ":"hya","ひゅ":"hyu","ひょ":"hyo",

    "みゃ":"mya","みゅ":"myu","みょ":"myo",

    "りゃ":"rya","りゅ":"ryu","りょ":"ryo",

    "ぎゃ":"gya","ぎゅ":"gyu","ぎょ":"gyo",

    "じゃ":"ja","じゅ":"ju","じょ":"jo",

    "びゃ":"bya","びゅ":"byu","びょ":"byo",

    "ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo"

  };

  function hiraganaToRomaji(text) {

    let result = "";

    let i = 0;

    while (i < text.length) {

      // 拗音

      const two =

        text.substring(i, i + 2);

      if (combinationMap[two]) {

        result += combinationMap[two];

        i += 2;

        continue;

      }

      // 促音「っ」

      if (text[i] === "っ") {

        const next =

          text.substring(i + 1, i + 3);

        if (combinationMap[next]) {

          result +=

            combinationMap[next][0];

        } else {

          const nextKana =

            kanaMap[text[i + 1]];

          if (nextKana) {

            result += nextKana[0];

          }

        }

        i++;

        continue;

      }

      // 通常の文字

      if (kanaMap[text[i]]) {

        result += kanaMap[text[i]];

      } else {

        result += text[i];

      }

      i++;

    }

    return result;

  }

  /* =========================

     入力時に自動変換

  ========================= */

  const textInput =

    document.getElementById("textInput");

  const romanResult =

    document.getElementById("romanResult");

  const reverseRomanResult =

    document.getElementById("reverseRomanResult");

  textInput.addEventListener("input", () => {

    const text =

      textInput.value;

    const roman =

      hiraganaToRomaji(text);

    const reversed =

      [...roman].reverse().join("");

    romanResult.textContent =

      roman || "---";

    reverseRomanResult.textContent =

      reversed || "---";

  });

</script>

</body>

</html>
