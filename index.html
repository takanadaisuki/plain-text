<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>逆再生セリフ作成用</title>

<style>

  body {

    font-family: sans-serif;

    max-width: 600px;

    margin: 0 auto;

    padding: 10px;

    line-height: 1.4;

  }

  h1 {

    text-align: center;

    font-size: 22px;

    margin: 5px 0 8px;

  }

  button {

    padding: 8px 10px;

    margin: 3px;

    font-size: 14px;

    border: none;

    border-radius: 7px;

    cursor: pointer;

  }

  button:disabled {

    opacity: 0.5;

    cursor: default;

  }

  .description {

    padding: 0;

    margin: 5px 0 10px;

    font-size: 12px;

    line-height: 1.4;

  }

  .description p {

    margin: 0;

  }

  .record-buttons {

    display: flex;

    align-items: center;

    gap: 8px;

    margin: 8px 0;

  }

  #recordButton {

    background: #ffe0e0;

    margin: 0;

    flex: 1;

    font-size: 14px;

    padding: 9px 10px;

    font-weight: bold;

  }

  #recordStatus {

    font-size: 13px;

    font-weight: bold;

    min-width: 90px;

    text-align: left;

  }

  #status {

    text-align: center;

    margin: 5px 0;

    font-size: 13px;

    font-weight: bold;

    min-height: 18px;

  }

  .play-buttons {

    display: flex;

    gap: 8px;

    margin: 8px 0;

  }

  .play-buttons button {

    flex: 1;

    font-size: 14px;

    padding: 9px 10px;

    font-weight: bold;

    margin: 0;

  }

  .normal-play {

    background: #e8f4ff;

  }

  .reverse-play {

    background: #fff0f5;

  }

  hr {

    margin: 12px 0;

  }

  .input-box {

    background: #f5f5f5;

    padding: 8px;

    margin-top: 8px;

    border-radius: 7px;

  }

  textarea {

    width: 100%;

    box-sizing: border-box;

    padding: 8px;

    font-size: 14px;

    margin: 0;

    border-radius: 6px;

    border: 1px solid #ccc;

    resize: none;

  }

  .result {

    background: #f7f7f7;

    padding: 7px 9px;

    margin-top: 6px;

    border-radius: 7px;

    word-break: break-all;

    font-size: 14px;

    min-height: 24px;

  }

  .result-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

  }

  .result-title {

    font-weight: bold;

  }

  .copy-button {

    margin: 0;

    padding: 4px 8px;

    font-size: 12px;

  }

  .warning {

    color: #d00;

    font-weight: bold;

    margin-top: 4px;

    font-size: 12px;

  }

  .conversion-description {

    background: #f5f5f5;

    padding: 8px;

    margin-top: 8px;

    border-radius: 7px;

    font-size: 11px;

    line-height: 1.4;

  }

  .conversion-description p {

    margin: 0 0 5px;

  }

  .conversion-description p:last-child {

    margin-bottom: 0;

  }

  footer {

    text-align: center;

    margin-top: 10px;

    font-size: 11px;

    color: #666;

  }

</style>

</head>

<body>

<h1>🎙️ 逆再生セリフ作成用</h1>

<div class="description">

  <p>このサイトは、録音した音声を逆再生するサイトです。ご自由に使用ください。</p>

</div>

<div class="record-buttons">

  <button id="recordButton">🎙️ 録音開始</button>

  <span id="recordStatus">録音待機中</span>

</div>

<div id="status"></div>

<div class="play-buttons">

  <button id="playButton" class="normal-play">▶️ 通常再生</button>

  <button id="reverseButton" class="reverse-play">🔄 逆再生</button>

</div>

<hr>

<div class="input-box">

  <textarea

    id="textInput"

    rows="2"

    placeholder="文字入力変換&#10;全てひらがなで入力してください"

  ></textarea>

</div>

<div class="result">

  <div class="result-header">

    <span class="result-title">ローマ字</span>

    <button

      class="copy-button"

      id="copyRomaji"

    >

      コピー

    </button>

  </div>

  <div id="romajiResult"></div>

</div>

<div class="result">

  <div class="result-header">

    <span class="result-title">逆順ローマ字</span>

    <button

      class="copy-button"

      id="copyReverse"

    >

      コピー

    </button>

  </div>

  <div id="reverseResult"></div>

</div>

<div class="result">

  <div class="result-title">

    逆から読めるひらがな

  </div>

  <div id="hiraganaResult"></div>

  <div id="warning" class="warning"></div>

</div>

<div class="conversion-description">

  <p>

    ひらがなをローマ字に変換し、さらに逆順にして、逆から読めるひらがなも表示します。

  </p>

  <p>

    ローマ字を反対から読むと「kyou」→「uoyk」のように、日本語で表記できない場合もあるため、表記できる部分のみをひらがなに変換します。

  </p>

</div>

<footer>

  製作者：高菜大好き

</footer>

<script>

let mediaRecorder;

let audioChunks = [];

let audioBlob = null;

let audioUrl = null;

let audio = null;

const recordButton =

  document.getElementById("recordButton");

const recordStatus =

  document.getElementById("recordStatus");

const playButton =

  document.getElementById("playButton");

const reverseButton =

  document.getElementById("reverseButton");

const status =

  document.getElementById("status");

recordButton.onclick = async () => {

  if (

    mediaRecorder &&

    mediaRecorder.state === "recording"

  ) {

    mediaRecorder.stop();

    recordButton.textContent =

      "🎙️ 録音開始";

    recordButton.style.background =

      "#ffe0e0";

    return;

  }

  try {

    const stream =

      await navigator.mediaDevices.getUserMedia({

        audio: true

      });

    audioChunks = [];

    let mimeType = "";

    if (

      MediaRecorder.isTypeSupported(

        "audio/webm;codecs=opus"

      )

    ) {

      mimeType =

        "audio/webm;codecs=opus";

    } else if (

      MediaRecorder.isTypeSupported(

        "audio/mp4"

      )

    ) {

      mimeType =

        "audio/mp4";

    }

    mediaRecorder =

      new MediaRecorder(

        stream,

        mimeType

          ? { mimeType }

          : undefined

      );

    mediaRecorder.ondataavailable =

      event => {

        if (event.data.size > 0) {

          audioChunks.push(event.data);

        }

      };

    mediaRecorder.onstop = () => {

      audioBlob =

        new Blob(

          audioChunks,

          {

            type: mediaRecorder.mimeType

          }

        );

      if (audioUrl) {

        URL.revokeObjectURL(audioUrl);

      }

      audioUrl =

        URL.createObjectURL(audioBlob);

      audio =

        new Audio(audioUrl);

      recordStatus.textContent =

        "録音完了";

      recordButton.textContent =

        "🎙️ 録音開始";

      recordButton.style.background =

        "#ffe0e0";

      stream

        .getTracks()

        .forEach(

          track => track.stop()

        );

    };

    mediaRecorder.start();

    recordButton.textContent =

      "⏹️ 録音停止";

    recordButton.style.background =

      "#eeeeee";

    recordStatus.textContent =

      "🔴 録音中...";

  } catch (error) {

    console.error(error);

    recordStatus.textContent =

      "録音できませんでした。";

  }

};

playButton.onclick = () => {

  if (!audioUrl) {

    alert("先に録音してください。");

    return;

  }

  const normalAudio =

    new Audio(audioUrl);

  normalAudio.play();

  status.textContent =

    "▶️ 通常再生中";

};

reverseButton.onclick = async () => {

  if (!audioBlob) {

    alert("先に録音してください。");

    return;

  }

  try {

    status.textContent =

      "🔄 逆再生を準備中...";

    const arrayBuffer =

      await audioBlob.arrayBuffer();

    const audioContext =

      new AudioContext();

    const decoded =

      await audioContext.decodeAudioData(

        arrayBuffer

      );

    const numberOfChannels =

      decoded.numberOfChannels;

    const sampleRate =

      decoded.sampleRate;

    const length =

      decoded.length;

    const offlineContext =

      new OfflineAudioContext(

        numberOfChannels,

        length,

        sampleRate

      );

    const buffer =

      offlineContext.createBuffer(

        numberOfChannels,

        length,

        sampleRate

      );

    for (

      let channel = 0;

      channel < numberOfChannels;

      channel++

    ) {

      const originalData =

        decoded.getChannelData(channel);

      const reversedData =

        buffer.getChannelData(channel);

      for (

        let i = 0;

        i < length;

        i++

      ) {

        reversedData[i] =

          originalData[length - 1 - i];

      }

    }

    const source =

      offlineContext.createBufferSource();

    source.buffer = buffer;

    source.connect(

      offlineContext.destination

    );

    source.start();

    const renderedBuffer =

      await offlineContext.startRendering();

    const wavBlob =

      audioBufferToWav(

        renderedBuffer

      );

    const reverseUrl =

      URL.createObjectURL(wavBlob);

    const reverseAudio =

      new Audio(reverseUrl);

    reverseAudio.onended = () => {

      URL.revokeObjectURL(reverseUrl);

    };

    reverseAudio.play();

    status.textContent =

      "🔄 逆再生中";

  } catch (error) {

    console.error(error);

    status.textContent =

      "逆再生できませんでした。";

  }

};

function audioBufferToWav(buffer) {

  const numberOfChannels =

    buffer.numberOfChannels;

  const sampleRate =

    buffer.sampleRate;

  const format = 1;

  const bitDepth = 16;

  const dataLength =

    buffer.length *

    numberOfChannels *

    bitDepth / 8;

  const arrayBuffer =

    new ArrayBuffer(

      44 + dataLength

    );

  const view =

    new DataView(arrayBuffer);

  writeString(view, 0, "RIFF");

  view.setUint32(

    4,

    36 + dataLength,

    true

  );

  writeString(view, 8, "WAVE");

  writeString(view, 12, "fmt ");

  view.setUint32(

    16,

    16,

    true

  );

  view.setUint16(

    20,

    format,

    true

  );

  view.setUint16(

    22,

    numberOfChannels,

    true

  );

  view.setUint32(

    24,

    sampleRate,

    true

  );

  view.setUint32(

    28,

    sampleRate *

    numberOfChannels *

    bitDepth / 8,

    true

  );

  view.setUint16(

    32,

    numberOfChannels *

    bitDepth / 8,

    true

  );

  view.setUint16(

    34,

    bitDepth,

    true

  );

  writeString(view, 36, "data");

  view.setUint32(

    40,

    dataLength,

    true

  );

  const channels = [];

  for (

    let i = 0;

    i < numberOfChannels;

    i++

  ) {

    channels.push(

      buffer.getChannelData(i)

    );

  }

  let offset = 44;

  for (

    let i = 0;

    i < buffer.length;

    i++

  ) {

    for (

      let channel = 0;

      channel < numberOfChannels;

      channel++

    ) {

      let sample =

        Math.max(

          -1,

          Math.min(

            1,

            channels[channel][i]

          )

        );

      sample =

        sample < 0

          ? sample * 0x8000

          : sample * 0x7FFF;

      view.setInt16(

        offset,

        sample,

        true

      );

      offset += 2;

    }

  }

  return new Blob(

    [arrayBuffer],

    {

      type: "audio/wav"

    }

  );

}

function writeString(

  view,

  offset,

  string

) {

  for (

    let i = 0;

    i < string.length;

    i++

  ) {

    view.setUint8(

      offset + i,

      string.charCodeAt(i)

    );

  }

}

const kanaMap = {

  "あ":"a","い":"i","う":"u","え":"e","お":"o",

  "か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",

  "さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",

  "た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to",

  "な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no",

  "は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho",

  "ま":"ma","み":"mi","む":"mu","め":"me","も":"mo",

  "や":"ya","ゆ":"yu","よ":"yo",

  "ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro",

  "わ":"wa","を":"wo","ん":"n",

  "が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go",

  "ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo",

  "だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do",

  "ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",

  "ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po",

  "きゃ":"kya","きゅ":"kyu","きょ":"kyo",

  "しゃ":"sha","しゅ":"shu","しょ":"sho",

  "ちゃ":"cha","ちゅ":"chu","ちょ":"cho",

  "にゃ":"nya","にゅ":"nyu","にょ":"nyo",

  "ひゃ":"hya","ひゅ":"hyu","ひょ":"hyo",

  "みゃ":"mya","みゅ":"myu","みょ":"myo",

  "りゃ":"rya","りゅ":"ryu","りょ":"ryo",

  "ぎゃ":"gya","ぎゅ":"gyu","ぎょ":"gyo",

  "じゃ":"ja","じゅ":"ju","じょ":"jo",

  "びゃ":"bya","びゅ":"byu","びょ":"byo",

  "ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo"

};

function hiraganaToRomaji(text) {

  let result = "";

  for (

    let i = 0;

    i < text.length;

    i++

  ) {

    const two =

      text.substring(i, i + 2);

    if (kanaMap[two]) {

      result += kanaMap[two];

      i++;

      continue;

    }

    if (kanaMap[text[i]]) {

      result += kanaMap[text[i]];

    } else {

      result += text[i];

    }

  }

  return result;

}

function reverseRomaji(text) {

  return text

    .split("")

    .reverse()

    .join("");

}

const romajiMap = {

  "shi":"し","si":"し",

  "chi":"ち","ti":"ち",

  "tsu":"つ","tu":"つ",

  "fu":"ふ","hu":"ふ",

  "ka":"か","ki":"き","ku":"く","ke":"け","ko":"こ",

  "sa":"さ","su":"す","se":"せ","so":"そ",

  "ta":"た","te":"て","to":"と",

  "na":"な","ni":"に","nu":"ぬ","ne":"ね","no":"の",

  "ha":"は","hi":"ひ","he":"へ","ho":"ほ",

  "ma":"ま","mi":"み","mu":"む","me":"め","mo":"も",

  "ya":"や","yu":"ゆ","yo":"よ",

  "ra":"ら","ri":"り","ru":"る","re":"れ","ro":"ろ",

  "wa":"わ","wo":"を","n":"ん",

  "ga":"が","gi":"ぎ","gu":"ぐ","ge":"げ","go":"ご",

  "za":"ざ","ji":"じ","zi":"じ","zu":"ず","ze":"ぜ","zo":"ぞ",

  "da":"だ","di":"ぢ","du":"づ","de":"で","do":"ど",

  "ba":"ば","bi":"び","bu":"ぶ","be":"べ","bo":"ぼ",

  "pa":"ぱ","pi":"ぴ","pu":"ぷ","pe":"ぺ","po":"ぽ",

  "kya":"きゃ","kyu":"きゅ","kyo":"きょ",

  "sha":"しゃ","shu":"しゅ","sho":"しょ",

  "cha":"ちゃ","chu":"ちゅ","cho":"ちょ",

  "nya":"にゃ","nyu":"にゅ","nyo":"にょ",

  "hya":"ひゃ","hyu":"ひゅ","hyo":"ひょ",

  "mya":"みゃ","myu":"みゅ","myo":"みょ",

  "rya":"りゃ","ryu":"りゅ","ryo":"りょ",

  "gya":"ぎゃ","gyu":"ぎゅ","gyo":"ぎょ",

  "ja":"じゃ","ju":"じゅ","jo":"じょ",

  "jya":"じゃ","jyu":"じゅ","jyo":"じょ",

  "bya":"びゃ","byu":"びゅ","byo":"びょ",

  "pya":"ぴゃ","pyu":"ぴゅ","pyo":"ぴょ",

  "a":"あ","i":"い","u":"う","e":"え","o":"お"

};

function romajiToHiragana(text) {

  let result = "";

  let warningFound = false;

  let pos = 0;

  while (pos < text.length) {

    let found = false;

    for (

      let len = 3;

      len >= 1;

      len--

    ) {

      const part =

        text.substring(

          pos,

          pos + len

        );

      if (romajiMap[part]) {

        result += romajiMap[part];

        pos += len;

        found = true;

        break;

      }

    }

    if (!found) {

      warningFound = true;

      pos++;

    }

  }

  return {

    text: result,

    warning: warningFound

  };

}

const textInput =

  document.getElementById("textInput");

const romajiResult =

  document.getElementById("romajiResult");

const reverseResult =

  document.getElementById("reverseResult");

const hiraganaResult =

  document.getElementById("hiraganaResult");

const warning =

  document.getElementById("warning");

textInput.addEventListener(

  "input",

  () => {

    const text =

      textInput.value;

    const romaji =

      hiraganaToRomaji(text);

    const reversed =

      reverseRomaji(romaji);

    const hiragana =

      romajiToHiragana(reversed);

    romajiResult.textContent =

      romaji;

    reverseResult.textContent =

      reversed;

    hiraganaResult.textContent =

      hiragana.text;

    if (hiragana.warning) {

      warning.textContent =

        "注意：表記不可の文字があります。";

    } else {

      warning.textContent =

        "";

    }

  }

);

async function copyText(text) {

  try {

    await navigator.clipboard.writeText(

      text

    );

  } catch {

    const textarea =

      document.createElement("textarea");

    textarea.value = text;

    document.body.appendChild(

      textarea

    );

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

  }

}

document.getElementById(

  "copyRomaji"

).onclick = () => {

  copyText(

    romajiResult.textContent

  );

};

document.getElementById(

  "copyReverse"

).onclick = () => {

  copyText(

    reverseResult.textContent

  );

};

</script>

</body>

</html>
