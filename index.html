<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>逆再生ボイス</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;

      background: #f5f5f5;

      color: #222;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }

    .container {

      width: 100%;

      max-width: 500px;

      background: white;

      border-radius: 20px;

      padding: 30px 20px;

      text-align: center;

      box-shadow: 0 5px 20px rgba(0,0,0,0.08);

    }

    h1 {

      margin-top: 0;

      font-size: 28px;

    }

    p {

      color: #666;

    }

    button {

      width: 100%;

      padding: 16px;

      margin-top: 12px;

      border: none;

      border-radius: 12px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

    }

    #recordButton {

      background: #ff4d4d;

      color: white;

    }

    #reverseButton {

      background: #333;

      color: white;

    }

    #normalButton {

      background: #ddd;

      color: #222;

    }

    #downloadButton {

      background: #4caf50;

      color: white;

    }

    button:disabled {

      opacity: 0.4;

    }

    #status {

      margin: 20px 0;

      font-weight: bold;

      min-height: 24px;

    }

    audio {

      width: 100%;

      margin-top: 20px;

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>🎙️ 逆再生ボイス</h1>

    <p>

      録音した声を逆再生してみよう！

    </p>

    <div id="status">

      録音する準備ができています

    </div>

    <button id="recordButton">

      🎙️ 録音開始

    </button>

    <button id="normalButton" disabled>

      ▶️ 通常再生

    </button>

    <button id="reverseButton" disabled>

      🔄 逆再生

    </button>

    <button id="downloadButton" disabled>

      💾 逆再生音声を保存

    </button>

    <audio id="audioPlayer" controls></audio>

  </div>

<script>

let mediaRecorder;

let audioChunks = [];

let recordedBlob = null;

let reversedBlob = null;

const recordButton = document.getElementById("recordButton");

const normalButton = document.getElementById("normalButton");

const reverseButton = document.getElementById("reverseButton");

const downloadButton = document.getElementById("downloadButton");

const status = document.getElementById("status");

const audioPlayer = document.getElementById("audioPlayer");

/* =========================

   録音開始

========================= */

recordButton.addEventListener("click", async () => {

  if (!mediaRecorder || mediaRecorder.state === "inactive") {

    try {

      const stream = await navigator.mediaDevices.getUserMedia({

        audio: true

      });

      audioChunks = [];

      let options = {};

      if (MediaRecorder.isTypeSupported("audio/webm")) {

        options.mimeType = "audio/webm";

      } else if (MediaRecorder.isTypeSupported("audio/mp4")) {

        options.mimeType = "audio/mp4";

      }

      mediaRecorder = new MediaRecorder(stream, options);

      mediaRecorder.ondataavailable = event => {

        if (event.data.size > 0) {

          audioChunks.push(event.data);

        }

      };

      mediaRecorder.onstop = async () => {

        stream.getTracks().forEach(track => track.stop());

        recordedBlob = new Blob(

          audioChunks,

          { type: mediaRecorder.mimeType }

        );

        const url = URL.createObjectURL(recordedBlob);

        audioPlayer.src = url;

        normalButton.disabled = false;

        reverseButton.disabled = false;

        status.textContent = "録音完了！";

        recordButton.textContent = "🎙️ もう一度録音";

        reversedBlob = await createReverseAudio(recordedBlob);

        downloadButton.disabled = false;

      };

      mediaRecorder.start();

      status.textContent = "🔴 録音中……";

      recordButton.textContent = "⏹️ 録音停止";

    } catch (error) {

      console.error(error);

      status.textContent =

        "マイクを使用できませんでした。ブラウザの設定を確認してください。";

    }

  } else {

    mediaRecorder.stop();

  }

});

/* =========================

   通常再生

========================= */

normalButton.addEventListener("click", () => {

  if (recordedBlob) {

    audioPlayer.src =

      URL.createObjectURL(recordedBlob);

    audioPlayer.play();

    status.textContent = "▶️ 通常再生中";

  }

});

/* =========================

   逆再生

========================= */

reverseButton.addEventListener("click", async () => {

  if (!recordedBlob) return;

  status.textContent = "🔄 逆再生音声を作成中……";

  if (!reversedBlob) {

    reversedBlob = await createReverseAudio(recordedBlob);

  }

  const url = URL.createObjectURL(reversedBlob);

  audioPlayer.src = url;

  audioPlayer.play();

  status.textContent = "🔄 逆再生中！";

});

/* =========================

   逆再生音声を作る

========================= */

async function createReverseAudio(blob) {

  const arrayBuffer = await blob.arrayBuffer();

  const audioContext =

    new (window.AudioContext || window.webkitAudioContext)();

  const audioBuffer =

    await audioContext.decodeAudioData(arrayBuffer);

  const numberOfChannels =

    audioBuffer.numberOfChannels;

  const length =

    audioBuffer.length;

  const sampleRate =

    audioBuffer.sampleRate;

  const reversedBuffer =

    audioContext.createBuffer(

      numberOfChannels,

      length,

      sampleRate

    );

  for (let channel = 0; channel < numberOfChannels; channel++) {

    const originalData =

      audioBuffer.getChannelData(channel);

    const reversedData =

      reversedBuffer.getChannelData(channel);

    for (let i = 0; i < length; i++) {

      reversedData[i] =

        originalData[length - i - 1];

    }

  }

  const wavBlob =

    audioBufferToWav(reversedBuffer);

  audioContext.close();

  return wavBlob;

}

/* =========================

   WAVに変換

========================= */

function audioBufferToWav(buffer) {

  const numberOfChannels =

    buffer.numberOfChannels;

  const sampleRate =

    buffer.sampleRate;

  const format = 1;

  const bitDepth = 16;

  const samples =

    buffer.length;

  const blockAlign =

    numberOfChannels * bitDepth / 8;

  const byteRate =

    sampleRate * blockAlign;

  const dataSize =

    samples * blockAlign;

  const arrayBuffer =

    new ArrayBuffer(44 + dataSize);

  const view =

    new DataView(arrayBuffer);

  function writeString(offset, string) {

    for (let i = 0; i < string.length; i++) {

      view.setUint8(

        offset + i,

        string.charCodeAt(i)

      );

    }

  }

  writeString(0, "RIFF");

  view.setUint32(

    4,

    36 + dataSize,

    true

  );

  writeString(8, "WAVE");

  writeString(12, "fmt ");

  view.setUint32(16, 16, true);

  view.setUint16(20, format, true);

  view.setUint16(

    22,

    numberOfChannels,

    true

  );

  view.setUint32(

    24,

    sampleRate,

    true

  );

  view.setUint32(

    28,

    byteRate,

    true

  );

  view.setUint16(

    32,

    blockAlign,

    true

  );

  view.setUint16(

    34,

    bitDepth,

    true

  );

  writeString(36, "data");

  view.setUint32(

    40,

    dataSize,

    true

  );

  let offset = 44;

  for (let i = 0; i < samples; i++) {

    for (

      let channel = 0;

      channel < numberOfChannels;

      channel++

    ) {

      let sample =

        buffer.getChannelData(channel)[i];

      sample =

        Math.max(-1, Math.min(1, sample));

      view.setInt16(

        offset,

        sample < 0

          ? sample * 0x8000

          : sample * 0x7FFF,

        true

      );

      offset += 2;

    }

  }

  return new Blob(

    [arrayBuffer],

    { type: "audio/wav" }

  );

}

/* =========================

   ダウンロード

========================= */

downloadButton.addEventListener("click", () => {

  if (!reversedBlob) return;

  const url =

    URL.createObjectURL(reversedBlob);

  const link =

    document.createElement("a");

  link.href = url;

  link.download =

    "reverse-voice.wav";

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

  URL.revokeObjectURL(url);

});

</script>

</body>

</html>
