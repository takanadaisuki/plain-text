<script>

/* ==================================================

   録音関連

================================================== */

let mediaRecorder = null;

let mediaStream = null;

let chunks = [];

let recordedBlob = null;

let recordedBuffer = null;

let audioContext = null;

let currentSource = null;

const recordButton =

  document.getElementById(

    "recordButton"

  );

const recordStatus =

  document.getElementById(

    "recordStatus"

  );

const status =

  document.getElementById(

    "status"

  );

/* ==================================================

   AudioContext

================================================== */

function getAudioContext() {

  if (!audioContext) {

    const AudioContextClass =

      window.AudioContext ||

      window.webkitAudioContext;

    if (!AudioContextClass) {

      return null;

    }

    audioContext =

      new AudioContextClass();

  }

  return audioContext;

}

/* ==================================================

   録音形式

================================================== */

function getMimeType() {

  if (

    typeof MediaRecorder ===

    "undefined"

  ) {

    return "";

  }

  const types = [

    "audio/mp4",

    "audio/webm;codecs=opus",

    "audio/webm",

    "audio/ogg;codecs=opus"

  ];

  for (

    const type of types

  ) {

    try {

      if (

        MediaRecorder.isTypeSupported(

          type

        )

      ) {

        return type;

      }

    }

    catch (error) {}

  }

  return "";

}

/* ==================================================

   マイク停止

================================================== */

function stopMicrophone() {

  if (mediaStream) {

    mediaStream

      .getTracks()

      .forEach(

        track => {

          track.stop();

        }

      );

    mediaStream =

      null;

  }

}

/* ==================================================

   エラー表示

================================================== */

function showMicError(error) {

  console.error(error);

  recordButton.textContent =

    "🎙️ 録音開始";

  recordStatus.textContent =

    "録音できません";

  if (

    error.name ===

      "NotAllowedError" ||

    error.name ===

      "PermissionDeniedError"

  ) {

    status.textContent =

      "マイクの使用を許可してください。";

  }

  else if (

    error.name ===

      "NotFoundError" ||

    error.name ===

      "DevicesNotFoundError"

  ) {

    status.textContent =

      "マイクが見つかりません。";

  }

  else if (

    error.name ===

      "NotReadableError" ||

    error.name ===

      "TrackStartError"

  ) {

    status.textContent =

      "マイクを使用できません。他のアプリを閉じてからお試しください。";

  }

  else {

    status.textContent =

      "録音できません。SafariまたはChromeで開いてください。";

  }

}

/* ==================================================

   録音開始

================================================== */

async function startRecording() {

  status.textContent =

    "";

  if (

    !window.isSecureContext

  ) {

    recordStatus.textContent =

      "録音できません";

    status.textContent =

      "HTTPSでサイトを開いてください。";

    return;

  }

  if (

    !navigator.mediaDevices ||

    !navigator.mediaDevices

      .getUserMedia

  ) {

    recordStatus.textContent =

      "録音非対応";

    status.textContent =

      "このブラウザではマイクを使用できません。";

    return;

  }

  if (

    typeof MediaRecorder ===

      "undefined"

  ) {

    recordStatus.textContent =

      "録音非対応";

    status.textContent =

      "このブラウザでは録音機能を使用できません。";

    return;

  }

  try {

    recordStatus.textContent =

      "マイク確認中";

    /*

      多くのスマホ・PCで

      動作しやすくするため

      audio:true のみ指定

    */

    mediaStream =

      await navigator.mediaDevices

        .getUserMedia({

          audio: true

        });

    const mimeType =

      getMimeType();

    try {

      if (mimeType) {

        mediaRecorder =

          new MediaRecorder(

            mediaStream,

            {

              mimeType:

                mimeType

            }

          );

      }

      else {

        mediaRecorder =

          new MediaRecorder(

            mediaStream

          );

      }

    }

    catch (error) {

      mediaRecorder =

        new MediaRecorder(

          mediaStream

        );

    }

    chunks = [];

    mediaRecorder.ondataavailable =

      event => {

        if (

          event.data &&

          event.data.size > 0

        ) {

          chunks.push(

            event.data

          );

        }

      };

    mediaRecorder.onstop =

      async () => {

        const type =

          mediaRecorder.mimeType ||

          mimeType ||

          "audio/webm";

        recordedBlob =

          new Blob(

            chunks,

            {

              type:

                type

            }

          );

        stopMicrophone();

        try {

          const arrayBuffer =

            await recordedBlob

              .arrayBuffer();

          const context =

            getAudioContext();

          if (!context) {

            throw new Error(

              "AudioContext unsupported"

            );

          }

          if (

            context.state ===

              "suspended"

          ) {

            await context.resume();

          }

          recordedBuffer =

            await context

              .decodeAudioData(

                arrayBuffer.slice(0)

              );

          recordStatus.textContent =

            "録音完了";

          status.textContent =

            "";

        }

        catch (error) {

          console.error(

            error

          );

          recordedBuffer =

            null;

          recordStatus.textContent =

            "録音完了";

          status.textContent =

            "音声を処理できませんでした。";

        }

      };

    mediaRecorder.onerror =

      event => {

        console.error(

          event

        );

        stopMicrophone();

        recordStatus.textContent =

          "録音エラー";

        status.textContent =

          "録音中にエラーが発生しました。";

      };

    /*

      1秒ごとにデータ取得

    */

    mediaRecorder.start(

      1000

    );

    recordButton.textContent =

      "⏹️ 録音停止";

    recordStatus.textContent =

      "🔴 録音中";

  }

  catch (error) {

    stopMicrophone();

    showMicError(

      error

    );

  }

}

/* ==================================================

   録音停止

================================================== */

function stopRecording() {

  if (

    mediaRecorder &&

    mediaRecorder.state ===

      "recording"

  ) {

    try {

      mediaRecorder.requestData();

    }

    catch (error) {}

    mediaRecorder.stop();

    recordButton.textContent =

      "🎙️ 録音開始";

    recordStatus.textContent =

      "録音処理中";

  }

}

/* ==================================================

   録音ボタン

================================================== */

recordButton.addEventListener(

  "click",

  async () => {

    if (

      mediaRecorder &&

      mediaRecorder.state ===

        "recording"

    ) {

      stopRecording();

    }

    else {

      await startRecording();

    }

  }

);

/* ==================================================

   再生停止

================================================== */

function stopCurrentAudio() {

  if (currentSource) {

    try {

      currentSource.stop();

    }

    catch (error) {}

    try {

      currentSource.disconnect();

    }

    catch (error) {}

    currentSource =

      null;

  }

}

/* ==================================================

   通常再生

================================================== */

document

  .getElementById(

    "normalPlay"

  )

  .addEventListener(

    "click",

    async () => {

      if (!recordedBuffer) {

        status.textContent =

          "先に録音してください。";

        return;

      }

      try {

        const context =

          getAudioContext();

        if (

          context.state ===

            "suspended"

        ) {

          await context.resume();

        }

        stopCurrentAudio();

        const source =

          context

            .createBufferSource();

        source.buffer =

          recordedBuffer;

        source.connect(

          context.destination

        );

        currentSource =

          source;

        source.start(0);

        status.textContent =

          "▶️ 通常再生中";

        source.onended =

          () => {

            if (

              currentSource ===

                source

            ) {

              currentSource =

                null;

              status.textContent =

                "";

            }

          };

      }

      catch (error) {

        console.error(

          error

        );

        status.textContent =

          "通常再生できませんでした。";

      }

    }

  );

/* ==================================================

   逆再生

================================================== */

document

  .getElementById(

    "reversePlay"

  )

  .addEventListener(

    "click",

    async () => {

      if (!recordedBuffer) {

        status.textContent =

          "先に録音してください。";

        return;

      }

      try {

        const context =

          getAudioContext();

        if (

          context.state ===

            "suspended"

        ) {

          await context.resume();

        }

        stopCurrentAudio();

        const reversed =

          context.createBuffer(

            recordedBuffer

              .numberOfChannels,

            recordedBuffer

              .length,

            recordedBuffer

              .sampleRate

          );

        for (

          let channel = 0;

          channel <

            recordedBuffer

              .numberOfChannels;

          channel++

        ) {

          const originalData =

            recordedBuffer

              .getChannelData(

                channel

              );

          const reversedData =

            reversed

              .getChannelData(

                channel

              );

          for (

            let i = 0;

            i <

              originalData.length;

            i++

          ) {

            reversedData[i] =

              originalData[

                originalData.length -

                1 -

                i

              ];

          }

        }

        const source =

          context

            .createBufferSource();

        source.buffer =

          reversed;

        source.connect(

          context.destination

        );

        currentSource =

          source;

        source.start(0);

        status.textContent =

          "🔄 逆再生中";

        source.onended =

          () => {

            if (

              currentSource ===

                source

            ) {

              currentSource =

                null;

              status.textContent =

                "";

            }

          };

      }

      catch (error) {

        console.error(

          error

        );

        status.textContent =

          "逆再生できませんでした。";

      }

    }

  );

/* ==================================================

/* ==================================================

   ひらがな→ローマ字

================================================== */

function hiraganaToRomaji(

  text

) {

  let result = "";

  for (

    let i = 0;

    i < text.length;

    i++

  ) {

    /*

      小さい「っ」

    */

    if (

      text[i] === "っ"

    ) {

      const nextTwo =

        text.substring(

          i + 1,

          i + 3

        );

      const nextOne =

        text.substring(

          i + 1,

          i + 2

        );

      const next =

        kanaMap[nextTwo] ||

        kanaMap[nextOne];

      if (next) {

        result +=

          next.charAt(0);

      }

      continue;

    }

    /*

      拗音など2文字を優先

    */

    const two =

      text.substring(

        i,

        i + 2

      );

    if (

      kanaMap[two]

    ) {

      result +=

        kanaMap[two];

      i++;

      continue;

    }

    /*

      1文字

    */

    const one =

      text[i];

    if (

      kanaMap[one]

    ) {

      result +=

        kanaMap[one];

    }

    else {

      result +=

        one;

    }

  }

  return result;

}

/* ==================================================

   逆順

================================================== */

function reverseText(

  text

) {

  return Array

    .from(text)

    .reverse()

    .join("");

}

/* ==================================================

   読める部分をすべて変換

================================================== */

function romajiToReadableHiragana(

  text

) {

  let result =

    "";

  let position =

    0;

  let hasUnreadable =

    false;

  while (

    position <

      text.length

  ) {

    let matched =

      false;

    /*

      長いものを優先

    */

    for (

      let length = 4;

      length >= 1;

      length--

    ) {

      const part =

        text.substring(

          position,

          position + length

        );

      if (

        romajiMap[part]

      ) {

        result +=

          romajiMap[part];

        position +=

          length;

        matched =

          true;

        break;

      }

    }

    /*

      読めない文字だけ飛ばして

      後ろの読める部分を継続

    */

    if (!matched) {

      hasUnreadable =

        true;

      position++;

    }

  }

  return {

    text:

      result,

    warning:

      hasUnreadable

  };

}

/* ==================================================

   文字入力

================================================== */

const textInput =

  document.getElementById(

    "textInput"

  );

const reverseReadingElement =

  document.getElementById(

    "reverseReading"

  );

const reverseRomajiElement =

  document.getElementById(

    "reverseRomaji"

  );

const romajiElement =

  document.getElementById(

    "romaji"

  );

const readingElement =

  document.getElementById(

    "reading"

  );

const warningElement =

  document.getElementById(

    "warning"

  );

textInput.addEventListener(

  "input",

  () => {

    const reading =

      textInput.value;

    const romaji =

      hiraganaToRomaji(

        reading

      );

    const reverseRomaji =

      reverseText(

        romaji

      );

    const converted =

      romajiToReadableHiragana(

        reverseRomaji

      );

    reverseReadingElement

      .textContent =

        converted.text;

    reverseRomajiElement

      .textContent =

        reverseRomaji;

    romajiElement

      .textContent =

        romaji;

    readingElement

      .textContent =

        reading;

    warningElement

      .style

      .display =

        converted.warning

          ? "block"

          : "none";

  }

);

/* ==================================================

   まとめてコピー

================================================== */

const copyButton =

  document.getElementById(

    "copyAll"

  );

const copyMessage =

  document.getElementById(

    "copyMessage"

  );

let copyTimer =

  null;

copyButton.addEventListener(

  "click",

  async () => {

    /*

      空行なし

    */

    const copyText =

`逆順読み方：${reverseReadingElement.textContent}

逆順ローマ字：${reverseRomajiElement.textContent}

ローマ字：${romajiElement.textContent}

読み方：${readingElement.textContent}`;

    let success =

      false;

    try {

      if (

        navigator.clipboard &&

        window.isSecureContext

      ) {

        await navigator.clipboard

          .writeText(

            copyText

          );

        success =

          true;

      }

    }

    catch (error) {

      console.error(

        error

      );

    }

    /*

      一部スマホ用

    */

    if (!success) {

      try {

        const temp =

          document.createElement(

            "textarea"

          );

        temp.value =

          copyText;

        temp.setAttribute(

          "readonly",

          ""

        );

        temp.style.position =

          "fixed";

        temp.style.opacity =

          "0";

        document.body

          .appendChild(

            temp

          );

        temp.focus();

        temp.select();

        temp.setSelectionRange(

          0,

          temp.value.length

        );

        success =

          document.execCommand(

            "copy"

          );

        temp.remove();

      }

      catch (error) {

        console.error(

          error

        );

      }

    }

    if (success) {

      copyMessage.textContent =

        "コピーしました";

    }

    else {

      copyMessage.textContent =

        "コピーできませんでした";

    }

    copyMessage.classList

      .add(

        "show"

      );

    if (copyTimer) {

      clearTimeout(

        copyTimer

      );

    }

    /*

      3秒後に自然に消える

    */

    copyTimer =

      setTimeout(

        () => {

          copyMessage

            .classList

            .remove(

              "show"

            );

        },

        3000

      );

  }

);
