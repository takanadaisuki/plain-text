<script>

/* =========================

   録音

========================= */

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let audioUrl = null;

let audio = null;

let currentStream = null;

let selectedMimeType = "";

const recordButton =

  document.getElementById(

    "recordButton"

  );

const recordStatus =

  document.getElementById(

    "recordStatus"

  );

const playButton =

  document.getElementById(

    "playButton"

  );

const reverseButton =

  document.getElementById(

    "reverseButton"

  );

const status =

  document.getElementById(

    "status"

  );

/* =========================

   録音対応チェック

========================= */

function checkRecordingSupport() {

  if (!window.isSecureContext) {

    recordStatus.textContent =

      "安全な接続が必要です。";

    return false;

  }

  if (!navigator.mediaDevices) {

    recordStatus.textContent =

      "このブラウザは非対応です。";

    return false;

  }

  if (

    !navigator.mediaDevices.getUserMedia

  ) {

    recordStatus.textContent =

      "マイク録音に非対応です。";

    return false;

  }

  if (!window.MediaRecorder) {

    recordStatus.textContent =

      "録音機能に非対応です。";

    return false;

  }

  return true;

}

/* =========================

   録音形式を選択

========================= */

function getSupportedMimeType() {

  const types = [

    "audio/webm;codecs=opus",

    "audio/webm",

    "audio/mp4",

    "audio/mp4;codecs=mp4a.40.2"

  ];

  for (

    const type of types

  ) {

    try {

      if (

        MediaRecorder.isTypeSupported(

          type

        )

      ) {

        return type;

      }

    } catch (error) {

      console.log(

        "形式確認エラー:",

        type,

        error

      );

    }

  }

  return "";

}

/* =========================

   エラー表示

========================= */

function getRecordingErrorMessage(

  error

) {

  if (!error) {

    return "録音できませんでした。";

  }

  switch (error.name) {

    case "NotAllowedError":

      return "マイクの使用を許可してください。";

    case "PermissionDeniedError":

      return "マイクの使用を許可してください。";

    case "NotFoundError":

      return "マイクが見つかりません。";

    case "DevicesNotFoundError":

      return "マイクが見つかりません。";

    case "NotReadableError":

      return "マイクを使用できません。他のアプリが使用していないか確認してください。";

    case "TrackStartError":

      return "マイクを開始できませんでした。";

    case "OverconstrainedError":

      return "使用できるマイクがありません。";

    case "SecurityError":

      return "ブラウザのセキュリティ設定により録音できません。";

    case "TypeError":

      return "この環境ではマイク録音を利用できません。";

    default:

      return "録音できませんでした。ブラウザのマイク設定を確認してください。";

  }

}

/* =========================

   録音開始

========================= */

async function startRecording() {

  if (

    !checkRecordingSupport()

  ) {

    return;

  }

  recordButton.disabled =

    true;

  recordStatus.textContent =

    "マイクを確認中...";

  try {

    currentStream =

      await navigator.mediaDevices

        .getUserMedia({

          audio: {

            echoCancellation: true,

            noiseSuppression: true,

            autoGainControl: true

          }

        });

    selectedMimeType =

      getSupportedMimeType();

    try {

      if (

        selectedMimeType

      ) {

        mediaRecorder =

          new MediaRecorder(

            currentStream,

            {

              mimeType:

                selectedMimeType

            }

          );

      } else {

        mediaRecorder =

          new MediaRecorder(

            currentStream

          );

      }

    } catch (error) {

      console.log(

        "指定形式で失敗。自動選択します。",

        error

      );

      mediaRecorder =

        new MediaRecorder(

          currentStream

        );

    }

    audioChunks = [];

    mediaRecorder.ondataavailable =

      event => {

        if (

          event.data &&

          event.data.size > 0

        ) {

          audioChunks.push(

            event.data

          );

        }

      };

    mediaRecorder.onstop =

      () => {

        try {

          const actualType =

            mediaRecorder.mimeType ||

            selectedMimeType ||

            "audio/webm";

          audioBlob =

            new Blob(

              audioChunks,

              {

                type:

                  actualType

              }

            );

          if (audioUrl) {

            URL.revokeObjectURL(

              audioUrl

            );

          }

          audioUrl =

            URL.createObjectURL(

              audioBlob

            );

          audio =

            new Audio(

              audioUrl

            );

          recordStatus.textContent =

            "録音完了";

          recordButton.textContent =

            "🎙️ 録音開始";

          recordButton.style.background =

            "#ffe0e0";

          if (

            currentStream

          ) {

            currentStream

              .getTracks()

              .forEach(

                track => {

                  track.stop();

                }

              );

            currentStream =

              null;

          }

        } catch (error) {

          console.error(

            error

          );

          recordStatus.textContent =

            "録音データを処理できませんでした。";

        }

      };

    mediaRecorder.onerror =

      event => {

        console.error(

          "MediaRecorder error:",

          event

        );

        recordStatus.textContent =

          "録音中にエラーが発生しました。";

      };

    mediaRecorder.start();

    recordButton.textContent =

      "⏹️ 録音停止";

    recordButton.style.background =

      "#eeeeee";

    recordStatus.textContent =

      "🔴 録音中...";

    recordButton.disabled =

      false;

  } catch (error) {

    console.error(

      "録音開始エラー:",

      error

    );

    if (

      currentStream

    ) {

      currentStream

        .getTracks()

        .forEach(

          track => {

            track.stop();

          }

        );

      currentStream =

        null;

    }

    recordButton.textContent =

      "🎙️ 録音開始";

    recordButton.style.background =

      "#ffe0e0";

    recordStatus.textContent =

      getRecordingErrorMessage(

        error

      );

    recordButton.disabled =

      false;

  }

}

/* =========================

   録音停止

========================= */

function stopRecording() {

  if (

    mediaRecorder &&

    mediaRecorder.state ===

      "recording"

  ) {

    mediaRecorder.stop();

    recordButton.textContent =

      "🎙️ 録音開始";

    recordButton.style.background =

      "#ffe0e0";

    recordStatus.textContent =

      "録音処理中...";

  }

}

/* =========================

   録音ボタン

========================= */

recordButton.onclick =

  async () => {

    if (

      mediaRecorder &&

      mediaRecorder.state ===

        "recording"

    ) {

      stopRecording();

    } else {

      await startRecording();

    }

  };

/* =========================

   通常再生

========================= */

playButton.onclick =

  () => {

    if (!audioUrl) {

      alert(

        "先に録音してください。"

      );

      return;

    }

    const normalAudio =

      new Audio(

        audioUrl

      );

    normalAudio.play()

      .then(

        () => {

          status.textContent =

            "▶️ 通常再生中";

        }

      )

      .catch(

        error => {

          console.error(

            error

          );

          status.textContent =

            "通常再生できませんでした。";

        }

      );

    normalAudio.onended =

      () => {

        status.textContent =

          "";

      };

  };

/* =========================

   逆再生

========================= */

reverseButton.onclick =

  async () => {

    if (!audioBlob) {

      alert(

        "先に録音してください。"

      );

      return;

    }

    try {

      status.textContent =

        "🔄 逆再生を準備中...";

      const arrayBuffer =

        await audioBlob.arrayBuffer();

      const AudioContextClass =

        window.AudioContext ||

        window.webkitAudioContext;

      if (

        !AudioContextClass

      ) {

        throw new Error(

          "AudioContext not supported"

        );

      }

      const audioContext =

        new AudioContextClass();

      if (

        audioContext.state ===

        "suspended"

      ) {

        await audioContext.resume();

      }

      const decoded =

        await audioContext

          .decodeAudioData(

            arrayBuffer

          );

      const numberOfChannels =

        decoded.numberOfChannels;

      const sampleRate =

        decoded.sampleRate;

      const length =

        decoded.length;

      const OfflineContextClass =

        window.OfflineAudioContext ||

        window.webkitOfflineAudioContext;

      if (

        !OfflineContextClass

      ) {

        throw new Error(

          "OfflineAudioContext not supported"

        );

      }

      const offlineContext =

        new OfflineContextClass(

          numberOfChannels,

          length,

          sampleRate

        );

      const buffer =

        offlineContext.createBuffer(

          numberOfChannels,

          length,

          sampleRate

        );

      for (

        let channel = 0;

        channel < numberOfChannels;

        channel++

      ) {

        const originalData =

          decoded.getChannelData(

            channel

          );

        const reversedData =

          buffer.getChannelData(

            channel

          );

        for (

          let i = 0;

          i < length;

          i++

        ) {

          reversedData[i] =

            originalData[

              length - 1 - i

            ];

        }

      }

      const source =

        offlineContext

          .createBufferSource();

      source.buffer =

        buffer;

      source.connect(

        offlineContext.destination

      );

      source.start();

      const renderedBuffer =

        await offlineContext

          .startRendering();

      const wavBlob =

        audioBufferToWav(

          renderedBuffer

        );

      const reverseUrl =

        URL.createObjectURL(

          wavBlob

        );

      const reverseAudio =

        new Audio(

          reverseUrl

        );

      reverseAudio.onended =

        () => {

          URL.revokeObjectURL(

            reverseUrl

          );

          status.textContent =

            "";

        };

      await reverseAudio.play();

      status.textContent =

        "🔄 逆再生中";

      if (

        audioContext.close

      ) {

        audioContext.close();

      }

    } catch (error) {

      console.error(

        "逆再生エラー:",

        error

      );

      status.textContent =

        "逆再生できませんでした。もう一度録音してください。";

    }

  };

/* =========================

   WAV変換

========================= */

function audioBufferToWav(

  buffer

) {

  const numberOfChannels =

    buffer.numberOfChannels;

  const sampleRate =

    buffer.sampleRate;

  const format = 1;

  const bitDepth = 16;

  const dataLength =

    buffer.length *

    numberOfChannels *

    bitDepth / 8;

  const arrayBuffer =

    new ArrayBuffer(

      44 + dataLength

    );

  const view =

    new DataView(

      arrayBuffer

    );

  writeString(

    view,

    0,

    "RIFF"

  );

  view.setUint32(

    4,

    36 + dataLength,

    true

  );

  writeString(

    view,

    8,

    "WAVE"

  );

  writeString(

    view,

    12,

    "fmt "

  );

  view.setUint32(

    16,

    16,

    true

  );

  view.setUint16(

    20,

    format,

    true

  );

  view.setUint16(

    22,

    numberOfChannels,

    true

  );

  view.setUint32(

    24,

    sampleRate,

    true

  );

  view.setUint32(

    28,

    sampleRate *

    numberOfChannels *

    bitDepth / 8,

    true

  );

  view.setUint16(

    32,

    numberOfChannels *

    bitDepth / 8,

    true

  );

  view.setUint16(

    34,

    bitDepth,

    true

  );

  writeString(

    view,

    36,

    "data"

  );

  view.setUint32(

    40,

    dataLength,

    true

  );

  const channels = [];

  for (

    let i = 0;

    i < numberOfChannels;

    i++

  ) {

    channels.push(

      buffer.getChannelData(

        i

      )

    );

  }

  let offset = 44;

  for (

    let i = 0;

    i < buffer.length;

    i++

  ) {

    for (

      let channel = 0;

      channel < numberOfChannels;

      channel++

    ) {

      let sample =

        Math.max(

          -1,

          Math.min(

            1,

            channels[channel][i]

          )

        );

      sample =

        sample < 0

          ? sample * 0x8000

          : sample * 0x7FFF;

      view.setInt16(

        offset,

        sample,

        true

      );

      offset += 2;

    }

  }

  return new Blob(

    [arrayBuffer],

    {

      type: "audio/wav"

    }

  );

}

function writeString(

  view,

  offset,

  string

) {

  for (

    let i = 0;

    i < string.length;

    i++

  ) {

    view.setUint8(

      offset + i,

      string.charCodeAt(i)

    );

  }

}

/* =========================

   ひらがな→ローマ字

========================= */

function hiraganaToRomaji(

  text

) {

  let result = "";

  for (

    let i = 0;

    i < text.length;

    i++

  ) {

    const two =

      text.substring(

        i,

        i + 2

      );

    if (

      kanaMap[two]

    ) {

      result +=

        kanaMap[two];

      i++;

      continue;

    }

    if (

      kanaMap[text[i]]

    ) {

      result +=

        kanaMap[text[i]];

    } else {

      result +=

        text[i];

    }

  }

  return result;

}

/* =========================

   逆順

========================= */

function reverseRomaji(

  text

) {

  return text

    .split("")

    .reverse()

    .join("");

}

/* =========================

   ローマ字→ひらがな

========================= */

const romajiMap = {

  "shi":"し",

  "si":"し",

  "chi":"ち",

  "ti":"ち",

  "tsu":"つ",

  "tu":"つ",

  "fu":"ふ",

  "hu":"ふ",

/* =========================

   ローマ字→ひらがな

========================= */

function romajiToHiragana(

  text

) {

  let result = "";

  let warningFound = false;

  let pos = 0;

  while (

    pos < text.length

  ) {

    let found = false;

    for (

      let len = 3;

      len >= 1;

      len--

    ) {

      const part =

        text.substring(

          pos,

          pos + len

        );

      if (

        romajiMap[part]

      ) {

        result +=

          romajiMap[part];

        pos += len;

        found = true;

        break;

      }

    }

    if (!found) {

      warningFound = true;

      pos++;

    }

  }

  return {

    text:

      result,

    warning:

      warningFound

  };

}

/* =========================

   文字入力

========================= */

const textInput =

  document.getElementById(

    "textInput"

  );

const romajiResult =

  document.getElementById(

    "romajiResult"

  );

const reverseResult =

  document.getElementById(

    "reverseResult"

  );

const hiraganaResult =

  document.getElementById(

    "hiraganaResult"

  );

const readingResult =

  document.getElementById(

    "readingResult"

  );

const warning =

  document.getElementById(

    "warning"

  );

textInput.addEventListener(

  "input",

  () => {

    const text =

      textInput.value;

    /*

      ローマ字

    */

    const romaji =

      hiraganaToRomaji(

        text

      );

    /*

      逆順ローマ字

    */

    const reversed =

      reverseRomaji(

        romaji

      );

    /*

      逆順読み方

    */

    const hiragana =

      romajiToHiragana(

        reversed

      );

    /*

      表示

    */

    hiraganaResult.textContent =

      hiragana.text;

    reverseResult.textContent =

      reversed;

    romajiResult.textContent =

      romaji;

    readingResult.textContent =

      text;

    /*

      警告

    */

    if (

      hiragana.warning

    ) {

      warning.textContent =

        "注意：表記不可の文字があります。";

    } else {

      warning.textContent =

        "";

    }

  }

);

/* =========================

   まとめてコピー

========================= */

document.getElementById(

  "copyAll"

).onclick =

  async () => {

    const text =

`逆順読み方：${hiraganaResult.textContent}

逆順ローマ字：${reverseResult.textContent}

ローマ字：${romajiResult.textContent}

読み方：${readingResult.textContent}`;

    try {

      await navigator.clipboard

        .writeText(

          text

        );

      alert(

        "コピーしました！"

      );

    } catch (error) {

      /*

        古いブラウザ用

      */

      const textarea =

        document.createElement(

          "textarea"

        );

      textarea.value =

        text;

      document.body.appendChild(

        textarea

      );

      textarea.select();

      document.execCommand(

        "copy"

      );

      textarea.remove();

      alert(

        "コピーしました！"

      );

    }

  };
