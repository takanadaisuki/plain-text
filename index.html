<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>逆再生セリフ作成用</title>

<style>

body {

  font-family: sans-serif;

  max-width: 600px;

  margin: 0 auto;

  padding: 20px;

  line-height: 1.6;

}

h1 {

  font-size: 24px;

}

button {

  padding: 10px 15px;

  margin: 5px 0;

  font-size: 16px;

}

textarea {

  width: 100%;

  box-sizing: border-box;

  padding: 10px;

  font-size: 18px;

}

.result {

  background: #f5f5f5;

  padding: 12px;

  margin-top: 10px;

  border-radius: 8px;

  word-break: break-all;

}

.copy {

  font-size: 14px;

  padding: 6px 10px;

}

.warning {

  color: red;

  font-weight: bold;

}

footer {

  margin-top: 40px;

  text-align: center;

  color: #666;

  font-size: 14px;

}

</style>

</head>

<body>

<h1>🎙️ 逆再生セリフ作成用</h1>

<h2>🎤 音声を逆再生</h2>

<button id="start">録音開始</button>

<button id="stop" disabled>録音停止</button>

<p id="status">待機中</p>

<audio id="normalAudio" controls></audio>

<br>

<audio id="reverseAudio" controls></audio>

<br>

<button id="download" disabled>逆再生音声をダウンロード</button>

<h2>🔤 文字を逆再生</h2>

<textarea id="kanaInput" rows="3" placeholder="ひらがなを入力してください"></textarea>

<div class="result">

  <strong>ローマ字：</strong>

  <div id="romajiResult"></div>

  <button class="copy" onclick="copyText('romajiResult')">コピー</button>

</div>

<div class="result">

  <strong>逆ローマ字：</strong>

  <div id="reverseResult"></div>

  <button class="copy" onclick="copyText('reverseResult')">コピー</button>

</div>

<div class="result">

  <strong>逆から読んだ結果：</strong>

  <div id="hiraganaResult"></div>

</div>

<div id="warning" class="warning"></div>

<footer>

  製作者：高菜大好き<br>

</footer>

<script>

/* =========================

   録音・逆再生

========================= */

let mediaRecorder;

let audioChunks = [];

let audioBlob;

const startButton = document.getElementById("start");

const stopButton = document.getElementById("stop");

const statusText = document.getElementById("status");

const normalAudio = document.getElementById("normalAudio");

const reverseAudio = document.getElementById("reverseAudio");

const downloadButton = document.getElementById("download");

startButton.addEventListener("click", async () => {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({

      audio: true

    });

    audioChunks = [];

    let options = {};

    if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {

      options = {

        mimeType: "audio/webm;codecs=opus"

      };

    } else if (MediaRecorder.isTypeSupported("audio/mp4")) {

      options = {

        mimeType: "audio/mp4"

      };

    }

    mediaRecorder = new MediaRecorder(stream, options);

    mediaRecorder.ondataavailable = event => {

      if (event.data.size > 0) {

        audioChunks.push(event.data);

      }

    };

    mediaRecorder.onstop = async () => {

      audioBlob = new Blob(audioChunks, {

        type: mediaRecorder.mimeType

      });

      normalAudio.src = URL.createObjectURL(audioBlob);

      await createReverseAudio(audioBlob);

      stream.getTracks().forEach(track => track.stop());

    };

    mediaRecorder.start();

    startButton.disabled = true;

    stopButton.disabled = false;

    statusText.textContent = "🔴 録音中...";

  } catch (error) {

    console.error(error);

    statusText.textContent =

      "マイクを使用できませんでした。マイクの許可を確認してください。";

  }

});

stopButton.addEventListener("click", () => {

  if (mediaRecorder && mediaRecorder.state !== "inactive") {

    mediaRecorder.stop();

    startButton.disabled = false;

    stopButton.disabled = true;

    statusText.textContent = "録音完了";

  }

});

async function createReverseAudio(blob) {

  const arrayBuffer = await blob.arrayBuffer();

  const AudioContext =

    window.AudioContext || window.webkitAudioContext;

  const audioContext = new AudioContext();

  const audioBuffer =

    await audioContext.decodeAudioData(arrayBuffer);

  const reversedBuffer =

    audioContext.createBuffer(

      audioBuffer.numberOfChannels,

      audioBuffer.length,

      audioBuffer.sampleRate

    );

  for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {

    const original =

      audioBuffer.getChannelData(channel);

    const reversed =

      reversedBuffer.getChannelData(channel);

    for (let i = 0; i < original.length; i++) {

      reversed[i] =

        original[original.length - 1 - i];

    }

  }

  const wavBlob =

    audioBufferToWav(reversedBuffer);

  reverseAudio.src =

    URL.createObjectURL(wavBlob);

  downloadButton.disabled = false;

  downloadButton.onclick = () => {

    const url =

      URL.createObjectURL(wavBlob);

    const a =

      document.createElement("a");

    a.href = url;

    a.download = "reverse.wav";

    a.click();

    URL.revokeObjectURL(url);

  };

}

/* =========================

   WAV変換

========================= */

function audioBufferToWav(buffer) {

  const numChannels = buffer.numberOfChannels;

  const sampleRate = buffer.sampleRate;

  const format = 1;

  const bitDepth = 16;

  const samples = buffer.length;

  const blockAlign =

    numChannels * bitDepth / 8;

  const byteRate =

    sampleRate * blockAlign;

  const dataSize =

    samples * blockAlign;

  const bufferSize =

    44 + dataSize;

  const arrayBuffer =

    new ArrayBuffer(bufferSize);

  const view =

    new DataView(arrayBuffer);

  function writeString(offset, string) {

    for (let i = 0; i < string.length; i++) {

      view.setUint8(

        offset + i,

        string.charCodeAt(i)

      );

    }

  }

  writeString(0, "RIFF");

  view.setUint32(

    4,

    36 + dataSize,

    true

  );

  writeString(8, "WAVE");

  writeString(12, "fmt ");

  view.setUint32(16, 16, true);

  view.setUint16(20, format, true);

  view.setUint16(

    22,

    numChannels,

    true

  );

  view.setUint32(

    24,

    sampleRate,

    true

  );

  view.setUint32(

    28,

    byteRate,

    true

  );

  view.setUint16(

    32,

    blockAlign,

    true

  );

  view.setUint16(

    34,

    bitDepth,

    true

  );

  writeString(36, "data");

  view.setUint32(

    40,

    dataSize,

    true

  );

  let offset = 44;

  const channelData = [];

  for (let channel = 0; channel < numChannels; channel++) {

    channelData.push(

      buffer.getChannelData(channel)

    );

  }

  for (let i = 0; i < samples; i++) {

    for (let channel = 0; channel < numChannels; channel++) {

      let sample =

        channelData[channel][i];

      sample =

        Math.max(-1, Math.min(1, sample));

      view.setInt16(

        offset,

        sample < 0

          ? sample * 0x8000

          : sample * 0x7FFF,

        true

      );

      offset += 2;

    }

  }

  return new Blob(

    [arrayBuffer],

    { type: "audio/wav" }

  );

}

/* =========================

   ひらがな → ローマ字

========================= */

const kanaMap = {

"あ":"a","い":"i","う":"u","え":"e","お":"o",

"か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",

"が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go",

"さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",

"ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo",

"た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to",

"だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do",

"な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no",

"は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho",

"ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",

"ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po",

"ま":"ma","み":"mi","む":"mu","め":"me","も":"mo",

"や":"ya","ゆ":"yu","よ":"yo",

"ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro",

"わ":"wa","を":"wo","ん":"n",

"ぁ":"xa","ぃ":"xi","ぅ":"xu","ぇ":"xe","ぉ":"xo",

"ゃ":"xya","ゅ":"xyu","ょ":"xyo",

"っ":"xtsu",

"きゃ":"kya","きゅ":"kyu","きょ":"kyo",

"ぎゃ":"gya","ぎゅ":"gyu","ぎょ":"gyo",

"しゃ":"sha","しゅ":"shu","しょ":"sho",

"じゃ":"ja","じゅ":"ju","じょ":"jo",

"ちゃ":"cha","ちゅ":"chu","ちょ":"cho",

"にゃ":"nya","にゅ":"nyu","にょ":"nyo",

"ひゃ":"hya","ひゅ":"hyu","ひょ":"hyo",

"びゃ":"bya","びゅ":"byu","びょ":"byo",

"ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo",

"みゃ":"mya","みゅ":"myu","みょ":"myo",

"りゃ":"rya","りゅ":"ryu","りょ":"ryo"

};

/* =========================

   ひらがな → ローマ字処理

========================= */

function hiraganaToRomaji(text) {

  let result = "";

  for (let i = 0; i < text.length; i++) {

    const two =

      text.substring(i, i + 2);

    if (kanaMap[two]) {

      result += kanaMap[two];

      i++;

    } else if (kanaMap[text[i]]) {

      result += kanaMap[text[i]];

    } else {

      result += text[i];

    }

  }

  return result;

}

/* =========================

   ローマ字を逆にする

========================= */

function reverseRomaji(text) {

  return text

    .split("")

    .reverse()

    .join("");

}

/* =========================

   ローマ字 → ひらがな

   読めるところだけ変換

========================= */

const romajiMap = {

"a":"あ",

"i":"い",

"u":"う",

"e":"え",

"o":"お",

"ka":"か","ki":"き","ku":"く","ke":"け","ko":"こ",

"ga":"が","gi":"ぎ","gu":"ぐ","ge":"げ","go":"ご",

"sa":"さ","shi":"し","su":"す","se":"せ","so":"そ",

"za":"ざ","ji":"じ","zu":"ず","ze":"ぜ","zo":"ぞ",

"ta":"た","chi":"ち","tsu":"つ","te":"て","to":"と",

"da":"だ","di":"ぢ","du":"づ","de":"で","do":"ど",

"na":"な","ni":"に","nu":"ぬ","ne":"ね","no":"の",

"ha":"は","hi":"ひ","fu":"ふ","he":"へ","ho":"ほ",

"ba":"ば","bi":"び","bu":"ぶ","be":"べ","bo":"ぼ",

"pa":"ぱ","pi":"ぴ","pu":"ぷ","pe":"ぺ","po":"ぽ",

"ma":"ま","mi":"み","mu":"む","me":"め","mo":"も",

"ya":"や","yu":"ゆ","yo":"よ",

"ra":"ら","ri":"り","ru":"る","re":"れ","ro":"ろ",

"wa":"わ","wi":"ゐ","we":"ゑ","wo":"を",

"n":"ん",

"kya":"きゃ","kyu":"きゅ","kyo":"きょ",

"gya":"ぎゃ","gyu":"ぎゅ","gyo":"ぎょ",

"sha":"しゃ","shu":"しゅ","sho":"しょ",

"ja":"じゃ","ju":"じゅ","jo":"じょ",

"cha":"ちゃ","chu":"ちゅ","cho":"ちょ",

"nya":"にゃ","nyu":"にゅ","nyo":"にょ",

"hya":"ひゃ","hyu":"ひゅ","hyo":"ひょ",

"bya":"びゃ","byu":"びゅ","byo":"びょ",

"pya":"ぴゃ","pyu":"ぴゅ","pyo":"ぴょ",

"mya":"みゃ","myu":"みゅ","myo":"みょ",

"rya":"りゃ","ryu":"りゅ","ryo":"りょ"

};

/* =========================

   読めるところだけ変換

========================= */

function romajiToHiraganaPartial(text) {

  let result = "";

  let i = 0;

  let warning = false;

  while (i < text.length) {

    let found = false;

    /*

      長いローマ字から順番に確認

    */

    for (let length = 3; length >= 1; length--) {

      const part =

        text.substring(i, i + length);

      if (romajiMap[part]) {

        result += romajiMap[part];

        i += length;

        found = true;

        break;

      }

    }

    if (!found) {

      /*

        読めない文字はそこで終了

      */

      warning = true;

      break;

    }

  }

  return {

    result: result,

    warning: warning

  };

}

/* =========================

   入力時に自動変換

========================= */

const kanaInput =

  document.getElementById("kanaInput");

const romajiResult =

  document.getElementById("romajiResult");

const reverseResult =

  document.getElementById("reverseResult");

const hiraganaResult =

  document.getElementById("hiraganaResult");

const warning =

  document.getElementById("warning");

kanaInput.addEventListener("input", () => {

  const input =

    kanaInput.value;

  /*

    ひらがな → ローマ字

  */

  const romaji =

    hiraganaToRomaji(input);

  /*

    ローマ字を逆順

  */

  const reversed =

    reverseRomaji(romaji);

  /*

    逆ローマ字 → 読めるところだけひらがな

  */

  const converted =

    romajiToHiraganaPartial(reversed);

  romajiResult.textContent =

    romaji;

  reverseResult.textContent =

    reversed;

  hiraganaResult.textContent =

    converted.result;

  if (converted.warning) {

    warning.textContent =

      "注意：表記不可の文字があります。";

  } else {

    warning.textContent = "";

  }

});

/* =========================

   コピー

========================= */

function copyText(id) {

  const text =

    document.getElementById(id).textContent;

  navigator.clipboard.writeText(text);

}

</script>

</body>

</html>
