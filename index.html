<body>

<h1>🎙️ 逆再生セリフ作成用</h1>

<div class="description">

</div>

<div class="play-buttons">

<textarea

  id="textInput"

  rows="4"

  placeholder="文字入力変換&#10;全てひらがなで入力してください"

></textarea>

  </div>

    rows="4"

    placeholder="ここに入力してください"

</div>

<!-- 変換についての説明 -->

<div class="conversion-description">

  <p>

    ひらがなをローマ字に変換し、さらに逆順にして、逆から読めるひらがなも表示します。

  </p>

  <p>

    ローマ字を反対から読むと「kyou」→「uoyk」のように、日本語で表記できない場合もあるため、表記できる部分のみをひらがなに変換します。

  </p>

<script>

/* =========================

   録音

========================= */

let mediaRecorder;

let audioChunks = [];

let audioBlob = null;

let audioUrl = null;

let audio = null;

const recordButton =

  document.getElementById("recordButton");

const recordStatus =

  document.getElementById("recordStatus");

const playButton =

  document.getElementById("playButton");

const reverseButton =

  document.getElementById("reverseButton");

const status =

  document.getElementById("status");

/* =========================

   録音開始・停止

========================= */

recordButton.onclick = async () => {

  /* 録音中なら停止 */

  if (

    mediaRecorder &&

    mediaRecorder.state === "recording"

  ) {

    mediaRecorder.stop();

    recordButton.textContent =

      "🎙️ 録音開始";

    recordButton.style.background =

      "#ffe0e0";

    return;

  }

  /* 録音開始 */

  try {

    const stream =

      await navigator.mediaDevices.getUserMedia({

        audio: true

      });

    audioChunks = [];

    let mimeType = "";

    if (

      MediaRecorder.isTypeSupported(

        "audio/webm;codecs=opus"

      )

    ) {

      mimeType =

        "audio/webm;codecs=opus";

    } else if (

      MediaRecorder.isTypeSupported(

        "audio/mp4"

      )

    ) {

      mimeType =

        "audio/mp4";

    }

    mediaRecorder =

      new MediaRecorder(

        stream,

        mimeType

          ? { mimeType }

          : undefined

      );

    mediaRecorder.ondataavailable =

      event => {

        if (event.data.size > 0) {

          audioChunks.push(

            event.data

          );

        }

      };

    mediaRecorder.onstop = () => {

      audioBlob =

        new Blob(

          audioChunks,

          {

            type: mediaRecorder.mimeType

          }

        );

      if (audioUrl) {

        URL.revokeObjectURL(

          audioUrl

        );

      }

      audioUrl =

        URL.createObjectURL(

          audioBlob

        );

      audio =

        new Audio(audioUrl);

      recordStatus.textContent =

        "録音完了";

      recordButton.textContent =

        "🎙️ 録音開始";

      recordButton.style.background =

        "#ffe0e0";

      stream

        .getTracks()

        .forEach(

          track => track.stop()

        );

    };

    mediaRecorder.start();

    recordButton.textContent =

      "⏹️ 録音停止";

    recordButton.style.background =

      "#eeeeee";

    recordStatus.textContent =

      "🔴 録音中...";

  } catch (error) {

    console.error(error);

    recordStatus.textContent =

      "録音できませんでした。";

  }

};

/* =========================

   通常再生

========================= */

playButton.onclick = () => {

  if (!audioUrl) {

    alert("先に録音してください。");

    return;

  }

  const normalAudio =

    new Audio(audioUrl);

  normalAudio.play();

  status.textContent =

    "▶️ 通常再生中";

};

/* =========================

   逆再生

========================= */

reverseButton.onclick = async () => {

  if (!audioBlob) {

    alert("先に録音してください。");

    return;

  }

  try {

    status.textContent =

      "🔄 逆再生を準備中...";

    const arrayBuffer =

      await audioBlob.arrayBuffer();

    const audioContext =

      new AudioContext();

    const decoded =

      await audioContext.decodeAudioData(

        arrayBuffer

      );

    const numberOfChannels =

      decoded.numberOfChannels;

    const sampleRate =

      decoded.sampleRate;

    const length =

      decoded.length;

    const offlineContext =

      new OfflineAudioContext(

        numberOfChannels,

        length,

        sampleRate

      );

    const buffer =

      offlineContext.createBuffer(

        numberOfChannels,

        length,

        sampleRate

      );

    for (

      let channel = 0;

      channel < numberOfChannels;

      channel++

    ) {

      const originalData =

        decoded.getChannelData(channel);

      const reversedData =

        buffer.getChannelData(channel);

      for (

        let i = 0;

        i < length;

        i++

      ) {

        reversedData[i] =

          originalData[

            length - 1 - i

          ];

      }

    }

    const source =

      offlineContext.createBufferSource();

    source.buffer = buffer;

    source.connect(

      offlineContext.destination

    );

    source.start();

    const renderedBuffer =

      await offlineContext.startRendering();

    const wavBlob =

      audioBufferToWav(

        renderedBuffer

      );

    const reverseUrl =

      URL.createObjectURL(

        wavBlob

      );

    const reverseAudio =

      new Audio(reverseUrl);

    reverseAudio.onended = () => {

      URL.revokeObjectURL(

        reverseUrl

      );

    };

    reverseAudio.play();

    status.textContent =

      "🔄 逆再生中";

  } catch (error) {

    console.error(error);

    status.textContent =

      "逆再生できませんでした。";

  }

};

/* =========================

   WAV変換

========================= */

function audioBufferToWav(buffer) {

  const numberOfChannels =

    buffer.numberOfChannels;

  const sampleRate =

    buffer.sampleRate;

  const format = 1;

  const bitDepth = 16;

  const dataLength =

    buffer.length *

    numberOfChannels *

    bitDepth / 8;

  const arrayBuffer =

    new ArrayBuffer(

      44 + dataLength

    );

  const view =

    new DataView(

      arrayBuffer

    );

  writeString(

    view,

    0,

    "RIFF"

  );

  view.setUint32(

    4,

    36 + dataLength,

    true

  );

  writeString(

    view,

    8,

    "WAVE"

  );

  writeString(

    view,

    12,

    "fmt "

  );

  view.setUint32(

    16,

    16,

    true

  );

  view.setUint16(

    20,

    format,

    true

  );

  view.setUint16(

    22,

    numberOfChannels,

    true

  );

  view.setUint32(

    24,

    sampleRate,

    true

  );

  view.setUint32(

    28,

    sampleRate *

    numberOfChannels *

    bitDepth / 8,

    true

  );

  view.setUint16(

    32,

    numberOfChannels *

    bitDepth / 8,

    true

  );

  view.setUint16(

    34,

    bitDepth,

    true

  );

  writeString(

    view,

    36,

    "data"

  );

  view.setUint32(

    40,

    dataLength,

    true

  );

  const channels = [];

  for (

    let i = 0;

    i < numberOfChannels;

    i++

  ) {

    channels.push(

      buffer.getChannelData(i)

    );

  }

  let offset = 44;

  for (

    let i = 0;

    i < buffer.length;

    i++

  ) {

    for (

      let channel = 0;

      channel < numberOfChannels;

      channel++

    ) {

      let sample =

        Math.max(

          -1,

          Math.min(

            1,

            channels[channel][i]

          )

        );

      sample =

        sample < 0

          ? sample * 0x8000

          : sample * 0x7FFF;

      view.setInt16(

        offset,

        sample,

        true

      );

      offset += 2;

    }

  }

  return new Blob(

    [arrayBuffer],

    {

      type: "audio/wav"

    }

  );

}

function writeString(

  view,

  offset,

  string

) {

  for (

    let i = 0;

    i < string.length;

    i++

  ) {

    view.setUint8(

      offset + i,

      string.charCodeAt(i)

    );

  }

}

function hiraganaToRomaji(text) {

  let result = "";

  for (

    let i = 0;

    i < text.length;

    i++

  ) {

    const two =

      text.substring(

        i,

        i + 2

      );

    if (kanaMap[two]) {

      result +=

        kanaMap[two];

      i++;

      continue;

    }

    if (kanaMap[text[i]]) {

      result +=

        kanaMap[text[i]];

    } else {

      result +=

        text[i];

    }

  }

  return result;

}

/* =========================

   ローマ字を逆順

========================= */

function reverseRomaji(text) {

  return text

    .split("")

    .reverse()

    .join("");

}

function romajiToHiragana(text) {

  let result = "";

  let warningFound = false;

  let pos = 0;

  while (pos < text.length) {

    let found = false;

    for (

      let len = 3;

      len >= 1;

      len--

    ) {

      const part =

        text.substring(

          pos,

          pos + len

        );

      if (romajiMap[part]) {

        result +=

          romajiMap[part];

        pos += len;

        found = true;

        break;

      }

    }

    /*

      読めない文字は1文字だけ飛ばして、

      その後ろを続けて変換する

    */

    if (!found) {

      warningFound = true;

      pos++;

    }

  }

  return {

    text: result,

    warning: warningFound

  };

}

/* =========================

   文字入力

========================= */

const textInput =

  document.getElementById(

    "textInput"

  );

const romajiResult =

  document.getElementById(

    "romajiResult"

  );

const reverseResult =

  document.getElementById(

    "reverseResult"

  );

const hiraganaResult =

  document.getElementById(

    "hiraganaResult"

  );

const warning =

  document.getElementById(

    "warning"

  );

textInput.addEventListener(

  "input",

  () => {

    const text =

      textInput.value;

    const romaji =

      hiraganaToRomaji(text);

    const reversed =

      reverseRomaji(romaji);

    const hiragana =

      romajiToHiragana(

        reversed

      );

    romajiResult.textContent =

      romaji;

    reverseResult.textContent =

      reversed;

    hiraganaResult.textContent =

      hiragana.text;

    if (hiragana.warning) {

      warning.textContent =

        "注意：表記不可の文字があります。";

    } else {

      warning.textContent =

        "";

    }

  }

);

/* =========================

   コピー

========================= */

async function copyText(text) {

  try {

    await navigator.clipboard.writeText(

      text

    );

  } catch {

    const textarea =

      document.createElement(

        "textarea"

      );

    textarea.value = text;

    document.body.appendChild(

      textarea

    );

    textarea.select();

    document.execCommand(

      "copy"

    );

    textarea.remove();

  }

}

document.getElementById(

  "copyRomaji"

).onclick = () => {

  copyText(

    romajiResult.textContent

  );

};

document.getElementById(

  "copyReverse"

).onclick = () => {

  copyText(

    reverseResult.textContent

  );

};
