<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta

  name="viewport"

  content="width=device-width, initial-scale=1.0"

>

<meta

  name="robots"

  content="noindex, nofollow"

>

<title>逆再生セリフ作成用</title>

<style>

/* =========================

   全体

========================= */

* {

  box-sizing: border-box;

}

body {

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Helvetica Neue",

    Arial,

    sans-serif;

  max-width: 600px;

  margin: 0 auto;

  padding: 10px;

  background: #fff;

  color: #222;

  line-height: 1.35;

}

h1 {

  text-align: center;

  font-size: 32px;

  margin: 5px 0 10px;

}

/* =========================

   共通ボタン

========================= */

button {

  font-family: inherit;

  border: 2px solid transparent;

  border-radius: 7px;

  cursor: pointer;

  transition:

    background 0.15s,

    border-color 0.15s,

    color 0.15s,

    opacity 0.15s;

}

button:disabled {

  opacity: 0.35;

  cursor: default;

}

/* =========================

   録音

========================= */

.record-area {

  display: grid;

  grid-template-columns:

    1fr 1fr;

  align-items: center;

  gap: 8px;

  margin: 7px 0;

}

#recordButton {

  width: 100%;

  padding: 8px 10px;

  font-size: 14px;

  font-weight: bold;

  background: #ffe7e7;

}

#recordStatus {

  padding-left: 4px;

  font-size: 13px;

  font-weight: bold;

}

/* 録音中 */

#recordButton.recording {

  background: #ffd6d6;

  border-color: #df2929;

  color: #b00000;

  box-shadow:

    0 0 0 2px

    rgba(223, 41, 41, 0.08);

}

/* =========================

   録音・再生状態

========================= */

#status {

  min-height: 16px;

  margin: 2px 0 4px;

  text-align: center;

  font-size: 12px;

  font-weight: bold;

}

/* =========================

   再生ボタン

========================= */

.play-area {

  display: grid;

  grid-template-columns:

    1fr 1fr;

  gap: 8px;

  margin: 7px 0;

}

.play-area button {

  width: 100%;

  padding: 8px 10px;

  font-size: 14px;

  font-weight: bold;

}

/* 通常再生 */

#normalPlay {

  background: #e8f4ff;

}

#normalPlay.playing {

  background: #cfe9ff;

  border-color: #1684cc;

  color: #005f9e;

  box-shadow:

    0 0 0 2px

    rgba(22, 132, 204, 0.08);

}

/* 逆再生 */

#reversePlay {

  background: #fff0f5;

}

#reversePlay.playing {

  background: #ffdce8;

  border-color: #d81b60;

  color: #a6003c;

  box-shadow:

    0 0 0 2px

    rgba(216, 27, 96, 0.08);

}

hr {

  margin: 10px 0;

  border: 0;

  border-top: 1px solid #ddd;

}

/* =========================

   文字入力

========================= */

.input-box {

  margin-top: 6px;

}

#textInput {

  display: block;

  width: 100%;

  height: 42px;

  padding: 4px 8px;

  resize: none;

  border: 1px solid #ccc;

  border-radius: 7px;

  font-family: inherit;

  font-size: 13px;

  /*

    プレースホルダー2行の

    間隔をかなり狭く

  */

  line-height: 1;

}

#textInput::placeholder {

  color: #777;

  line-height: 1;

}

/* =========================

   変換結果

========================= */

.results {

  margin-top: 6px;

  padding: 7px 9px;

  background: #f7f7f7;

  border-radius: 7px;

  font-size: 14px;

  line-height: 1.65;

  word-break: break-all;

}

.result-line {

  margin: 0;

}

.result-label {

  font-weight: bold;

}

/* =========================

   注意

========================= */

#warning {

  display: none;

  margin-top: 2px;

  color: #c90000;

  font-size: 12px;

  font-weight: bold;

}

/* =========================

   コピー

========================= */

.copy-area {

  text-align: center;

  margin-top: 6px;

}

#copyAll {

  padding: 7px 18px;

  background: #eee;

  font-size: 13px;

  font-weight: bold;

}

#copyMessage {

  height: 16px;

  margin-top: 2px;

  font-size: 12px;

  font-weight: bold;

  opacity: 0;

  transition:

    opacity 0.3s ease;

}

#copyMessage.show {

  opacity: 1;

}

/* =========================

   サイト説明

========================= */

.site-description {

  margin-top: 4px;

  font-size: 11px;

  line-height: 1.35;

}

/* =========================

   変換説明

========================= */

.conversion-description {

  margin-top: 5px;

  font-size: 11px;

  line-height: 1.35;

}

.conversion-description p {

  margin: 0 0 3px;

}

/* =========================

   製作者

========================= */

footer {

  margin-top: 6px;

  text-align: center;

  font-size: 11px;

  color: #666;

}

.credit {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  gap: 3px;

}

.credit img {

  width: 12px;

  height: 12px;

  object-fit: contain;

}

/* =========================

   PC

========================= */

@media (min-width: 601px) {

  body {

    width: 600px;

  }

}

</style>

</head>

<body>

<h1>

  🎙️ 逆再生セリフ作成用

</h1>

<!-- =========================

     録音

========================= -->

<div class="record-area">

  <button id="recordButton">

    🎙️ 録音開始

  </button>

  <span id="recordStatus">

    録音待機中

  </span>

</div>

<div id="status"></div>

<!-- =========================

     再生

========================= -->

<div class="play-area">

  <button

    id="normalPlay"

    disabled

  >

    ▶️ 通常再生

  </button>

  <button

    id="reversePlay"

    disabled

  >

    🔄 逆再生

  </button>

</div>

<hr>

<!-- =========================

     文字入力

========================= -->

<div class="input-box">

<textarea

  id="textInput"

  rows="2"

  placeholder="文字入力変換

全てひらがなで入力してください"

></textarea>

</div>

<!-- =========================

     結果

========================= -->

<div class="results">

  <div class="result-line">

    <span class="result-label">

      逆順読み方：

    </span>

    <span id="reverseReading"></span>

  </div>

  <div class="result-line">

    <span class="result-label">

      逆順ローマ字：

    </span>

    <span id="reverseRomaji"></span>

  </div>

  <div class="result-line">

    <span class="result-label">

      ローマ字：

    </span>

    <span id="romaji"></span>

  </div>

  <div class="result-line">

    <span class="result-label">

      読み方：

    </span>

    <span id="reading"></span>

  </div>

  <div id="warning">

    注意：表記不可の文字があります。

  </div>

</div>

<!-- =========================

     コピー

========================= -->

<div class="copy-area">

  <button id="copyAll">

    📋 まとめてコピー

  </button>

  <div id="copyMessage">

    コピーしました

  </div>

</div>

<!-- =========================

     サイト説明

========================= -->

<div class="site-description">

  このサイトでは、録音した音声を通常再生・逆再生できます。文字入力からローマ字・逆順ローマ字・逆順の読み方への変換もできます。

</div>

<!-- =========================

     変換について

========================= -->

<div class="conversion-description">

  <p>

    ひらがなをローマ字に変換し、さらに逆順にして、逆から読めるひらがなも表示します。

  </p>

  <p>

    ローマ字を反対から読むと「kyou」→「uoyk」のように、日本語で表記できない場合もあるため、表記できる部分のみをひらがなに変換します。

  </p>

</div>

<!-- =========================

     製作者

========================= -->

<footer>

  <span class="credit">

    <span>

      製作者：高菜大好き

    </span>

    <img

      src="IMG_9704.jpeg"

      alt=""

    >

  </span>

</footer>

<script>

/* ==================================================

   状態

================================================== */

let mediaRecorder = null;

let mediaStream = null;

let chunks = [];

let recordedBlob = null;

let recordedBuffer = null;

let audioContext = null;

let currentSource = null;

/*

  idle

  recording

  normal

  reverse

*/

let appState =

  "idle";

/* ==================================================

   要素

================================================== */

const recordButton =

  document.getElementById(

    "recordButton"

  );

const recordStatus =

  document.getElementById(

    "recordStatus"

  );

const status =

  document.getElementById(

    "status"

  );

const normalPlayButton =

  document.getElementById(

    "normalPlay"

  );

const reversePlayButton =

  document.getElementById(

    "reversePlay"

  );

/* ==================================================

   AudioContext

================================================== */

function getAudioContext() {

  if (!audioContext) {

    const AudioContextClass =

      window.AudioContext ||

      window.webkitAudioContext;

    if (!AudioContextClass) {

      return null;

    }

    audioContext =

      new AudioContextClass();

  }

  return audioContext;

}

/* ==================================================

   UI更新

================================================== */

function updateUI() {

  /* -------------------------

     録音中

  ------------------------- */

  if (

    appState ===

      "recording"

  ) {

    recordButton.disabled =

      false;

    recordButton.textContent =

      "⏹️ 録音停止";

    recordButton

      .classList

      .add(

        "recording"

      );

    recordStatus.textContent =

      "🔴 録音中";

    normalPlayButton.disabled =

      true;

    reversePlayButton.disabled =

      true;

    normalPlayButton.textContent =

      "▶️ 通常再生";

    reversePlayButton.textContent =

      "🔄 逆再生";

    normalPlayButton

      .classList

      .remove(

        "playing"

      );

    reversePlayButton

      .classList

      .remove(

        "playing"

      );

    return;

  }

  /* -------------------------

     通常再生中

  ------------------------- */

  if (

    appState ===

      "normal"

  ) {

    recordButton.disabled =

      true;

    recordButton.textContent =

      "🎙️ 録音開始";

    recordButton

      .classList

      .remove(

        "recording"

      );

    normalPlayButton.disabled =

      false;

    normalPlayButton.textContent =

      "⏹️ 再生停止";

    normalPlayButton

      .classList

      .add(

        "playing"

      );

    reversePlayButton.disabled =

      true;

    reversePlayButton.textContent =

      "🔄 逆再生";

    reversePlayButton

      .classList

      .remove(

        "playing"

      );

    status.textContent =

      "▶️ 通常再生中";

    return;

  }

  /* -------------------------

     逆再生中

  ------------------------- */

  if (

    appState ===

      "reverse"

  ) {

    recordButton.disabled =

      true;

    recordButton.textContent =

      "🎙️ 録音開始";

    recordButton

      .classList

      .remove(

        "recording"

      );

    reversePlayButton.disabled =

      false;

    reversePlayButton.textContent =

      "⏹️ 再生停止";

    reversePlayButton

      .classList

      .add(

        "playing"

      );

    normalPlayButton.disabled =

      true;

    normalPlayButton.textContent =

      "▶️ 通常再生";

    normalPlayButton

      .classList

      .remove(

        "playing"

      );

    status.textContent =

      "🔄 逆再生中";

    return;

  }

  /* -------------------------

     待機

  ------------------------- */

  appState =

    "idle";

  recordButton.disabled =

    false;

  recordButton.textContent =

    "🎙️ 録音開始";

  recordButton

    .classList

    .remove(

      "recording"

    );

  normalPlayButton.textContent =

    "▶️ 通常再生";

  reversePlayButton.textContent =

    "🔄 逆再生";

  normalPlayButton

    .classList

    .remove(

      "playing"

    );

  reversePlayButton

    .classList

    .remove(

      "playing"

    );

  /*

    録音があれば再生可能

  */

  normalPlayButton.disabled =

    !recordedBuffer;

  reversePlayButton.disabled =

    !recordedBuffer;

  if (

    recordedBuffer

  ) {

    recordStatus.textContent =

      "録音完了";

  }

}

/* ==================================================

   MIMEタイプ

================================================== */

function getMimeType() {

  if (

    typeof MediaRecorder ===

      "undefined"

  ) {

    return "";

  }

  const types = [

    "audio/mp4",

    "audio/webm;codecs=opus",

    "audio/webm",

    "audio/ogg;codecs=opus"

  ];

  for (

    const type of types

  ) {

    try {

      if (

        MediaRecorder

          .isTypeSupported(

            type

          )

      ) {

        return type;

      }

    }

    catch (error) {}

  }

  return "";

}

/* ==================================================

   マイク停止

================================================== */

function stopMicrophone() {

  if (

    mediaStream

  ) {

    mediaStream

      .getTracks()

      .forEach(

        track => {

          track.stop();

        }

      );

    mediaStream =

      null;

  }

}

/* ==================================================

   マイクエラー

================================================== */

function showMicError(

  error

) {

  console.error(

    error

  );

  appState =

    "idle";

  recordStatus.textContent =

    "録音できません";

  if (

    error.name ===

      "NotAllowedError" ||

    error.name ===

      "PermissionDeniedError"

  ) {

    status.textContent =

      "マイクの使用を許可してください。";

  }

  else if (

    error.name ===

      "NotFoundError" ||

    error.name ===

      "DevicesNotFoundError"

  ) {

    status.textContent =

      "マイクが見つかりません。";

  }

  else if (

    error.name ===

      "NotReadableError" ||

    error.name ===

      "TrackStartError"

  ) {

    status.textContent =

      "マイクを使用できません。他のアプリを閉じてからお試しください。";

  }

  else {

    status.textContent =

      "録音できません。SafariまたはChromeで開いてください。";

  }

  updateUI();

}

/* ==================================================

   録音開始

================================================== */

async function startRecording() {

  /*

    再生中は録音しない

  */

  if (

    appState === "normal" ||

    appState === "reverse"

  ) {

    return;

  }

  status.textContent =

    "";

  if (

    !window.isSecureContext

  ) {

    recordStatus.textContent =

      "録音できません";

    status.textContent =

      "HTTPSでサイトを開いてください。";

    return;

  }

  if (

    !navigator.mediaDevices ||

    !navigator.mediaDevices

      .getUserMedia

  ) {

    recordStatus.textContent =

      "録音非対応";

    status.textContent =

      "このブラウザではマイクを使用できません。";

    return;

  }

  if (

    typeof MediaRecorder ===

      "undefined"

  ) {

    recordStatus.textContent =

      "録音非対応";

    status.textContent =

      "このブラウザでは録音機能を使用できません。";

    return;

  }

  try {

    recordStatus.textContent =

      "マイク確認中";

    mediaStream =

      await navigator.mediaDevices

        .getUserMedia({

          audio: true

        });

    const mimeType =

      getMimeType();

    try {

      mediaRecorder =

        mimeType

          ? new MediaRecorder(

              mediaStream,

              {

                mimeType:

                  mimeType

              }

            )

          : new MediaRecorder(

              mediaStream

            );

    }

    catch (error) {

      mediaRecorder =

        new MediaRecorder(

          mediaStream

        );

    }

    chunks = [];

    mediaRecorder

      .ondataavailable =

        event => {

          if (

            event.data &&

            event.data.size > 0

          ) {

            chunks.push(

              event.data

            );

          }

        };

    mediaRecorder.onstop =

      async () => {

        const type =

          mediaRecorder.mimeType ||

          mimeType ||

          "audio/webm";

        recordedBlob =

          new Blob(

            chunks,

            {

              type:

                type

            }

          );

        stopMicrophone();

        try {

          const arrayBuffer =

            await recordedBlob

              .arrayBuffer();

          const context =

            getAudioContext();

          if (!context) {

            throw new Error(

              "AudioContext unsupported"

            );

          }

          if (

            context.state ===

              "suspended"

          ) {

            await context.resume();

          }

          recordedBuffer =

            await context

              .decodeAudioData(

                arrayBuffer.slice(0)

              );

          appState =

            "idle";

          status.textContent =

            "";

          updateUI();

        }

        catch (error) {

          console.error(

            error

          );

          recordedBuffer =

            null;

          appState =

            "idle";

          recordStatus.textContent =

            "録音完了";

          status.textContent =

            "音声を処理できませんでした。";

          updateUI();

        }

      };

    mediaRecorder.onerror =

      event => {

        console.error(

          event

        );

        stopMicrophone();

        appState =

          "idle";

        recordStatus.textContent =

          "録音エラー";

        status.textContent =

          "録音中にエラーが発生しました。";

        updateUI();

      };

    /*

      録音開始

    */

    mediaRecorder.start(

      1000

    );

    appState =

      "recording";

    updateUI();

  }

  catch (error) {

    stopMicrophone();

    showMicError(

      error

    );

  }

}

/* ==================================================

   録音停止

================================================== */

function stopRecording() {

  if (

    mediaRecorder &&

    mediaRecorder.state ===

      "recording"

  ) {

    try {

      mediaRecorder.requestData();

    }

    catch (error) {}

    mediaRecorder.stop();

    recordButton

      .classList

      .remove(

        "recording"

      );

    recordButton.textContent =

      "🎙️ 録音開始";

    recordStatus.textContent =

      "録音処理中";

  }

}

/* ==================================================

   録音ボタン

================================================== */

recordButton

  .addEventListener(

    "click",

    async () => {

      if (

        appState ===

          "recording"

      ) {

        stopRecording();

        return;

      }

      if (

        appState ===

          "normal" ||

        appState ===

          "reverse"

      ) {

        return;

      }

      await startRecording();

    }

  );

/* ==================================================

   再生停止

================================================== */

function stopPlayback() {

  if (

    currentSource

  ) {

    const source =

      currentSource;

    currentSource =

      null;

    source.onended =

      null;

    try {

      source.stop();

    }

    catch (error) {}

    try {

      source.disconnect();

    }

    catch (error) {}

  }

  appState =

    "idle";

  status.textContent =

    "";

  updateUI();

}

/* ==================================================

   音声再生共通

================================================== */

async function playBuffer(

  buffer,

  type

) {

  const context =

    getAudioContext();

  if (!context) {

    status.textContent =

      "音声を再生できません。";

    return;

  }

  if (

    context.state ===

      "suspended"

  ) {

    await context.resume();

  }

  const source =

    context

      .createBufferSource();

  source.buffer =

    buffer;

  source.connect(

    context.destination

  );

  currentSource =

    source;

  appState =

    type;

  updateUI();

  source.start(0);

  source.onended =

    () => {

      if (

        currentSource ===

          source

      ) {

        currentSource =

          null;

        appState =

          "idle";

        status.textContent =

          "";

        updateUI();

      }

    };

}

/* ==================================================

   通常再生

================================================== */

normalPlayButton

  .addEventListener(

    "click",

    async () => {

      /*

        通常再生中なら停止

      */

      if (

        appState ===

          "normal"

      ) {

        stopPlayback();

        return;

      }

      /*

        録音中・逆再生中は不可

      */

      if (

        appState !==

          "idle"

      ) {

        return;

      }

      if (

        !recordedBuffer

      ) {

        return;

      }

      try {

        await playBuffer(

          recordedBuffer,

          "normal"

        );

      }

      catch (error) {

        console.error(

          error

        );

        appState =

          "idle";

        status.textContent =

          "通常再生できませんでした。";

        updateUI();

      }

    }

  );

/* ==================================================

   逆再生

================================================== */

reversePlayButton

  .addEventListener(

    "click",

    async () => {

      /*

        逆再生中なら停止

      */

      if (

        appState ===

          "reverse"

      ) {

        stopPlayback();

        return;

      }

      /*

        録音中・通常再生中は不可

      */

      if (

        appState !==

          "idle"

      ) {

        return;

      }

      if (

        !recordedBuffer

      ) {

        return;

      }

      try {

        const context =

          getAudioContext();

        const reversed =

          context.createBuffer(

            recordedBuffer

              .numberOfChannels,

            recordedBuffer

              .length,

            recordedBuffer

              .sampleRate

          );

        for (

          let channel = 0;

          channel <

            recordedBuffer

              .numberOfChannels;

          channel++

        ) {

          const originalData =

            recordedBuffer

              .getChannelData(

                channel

              );

          const reversedData =

            reversed

              .getChannelData(

                channel

              );

          for (

            let i = 0;

            i <

              originalData.length;

            i++

          ) {

            reversedData[i] =

              originalData[

                originalData.length -

                1 -

                i

              ];

          }

        }

        await playBuffer(

          reversed,

          "reverse"

        );

      }

      catch (error) {

        console.error(

          error

        );

        appState =

          "idle";

        status.textContent =

          "逆再生できませんでした。";

        updateUI();

      }

    }

  );

/* ==================================================

   ひらがな → ローマ字

================================================== */

function hiraganaToRomaji(

  text

) {

  let result =

    "";

  for (

    let i = 0;

    i <

      text.length;

    i++

  ) {

    /*

      小さい「っ」

    */

    if (

      text[i] ===

        "っ"

    ) {

      const nextTwo =

        text.substring(

          i + 1,

          i + 3

        );

      const nextOne =

        text.substring(

          i + 1,

          i + 2

        );

      const next =

        kanaMap[nextTwo] ||

        kanaMap[nextOne];

      if (next) {

        result +=

          next.charAt(0);

      }

      continue;

    }

    /*

      2文字を優先

    */

    const two =

      text.substring(

        i,

        i + 2

      );

    if (

      kanaMap[two]

    ) {

      result +=

        kanaMap[two];

      i++;

      continue;

    }

    /*

      1文字

    */

    if (

      kanaMap[

        text[i]

      ]

    ) {

      result +=

        kanaMap[

          text[i]

        ];

    }

    else {

      result +=

        text[i];

    }

  }

  return result;

}

/* ==================================================

   逆順

================================================== */

function reverseText(

  text

) {

  return Array

    .from(text)

    .reverse()

    .join("");

}

/* ==================================================

   読めるところを全部変換

================================================== */

function romajiToReadableHiragana(

  text

) {

  let result =

    "";

  let position =

    0;

  let hasUnreadable =

    false;

  while (

    position <

      text.length

  ) {

    let matched =

      false;

    for (

      let length = 4;

      length >= 1;

      length--

    ) {

      const part =

        text.substring(

          position,

          position + length

        );

      if (

        romajiMap[

          part

        ]

      ) {

        result +=

          romajiMap[

            part

          ];

        position +=

          length;

        matched =

          true;

        break;

      }

    }

    /*

      読めない文字だけ飛ばし、

      後ろにある読める文字を

      引き続き探す

    */

    if (!matched) {

      hasUnreadable =

        true;

      position++;

    }

  }

  return {

    text:

      result,

    warning:

      hasUnreadable

  };

}

/* ==================================================

   文字入力処理

================================================== */

const textInput =

  document.getElementById(

    "textInput"

  );

const reverseReadingElement =

  document.getElementById(

    "reverseReading"

  );

const reverseRomajiElement =

  document.getElementById(

    "reverseRomaji"

  );

const romajiElement =

  document.getElementById(

    "romaji"

  );

const readingElement =

  document.getElementById(

    "reading"

  );

const warningElement =

  document.getElementById(

    "warning"

  );

textInput

  .addEventListener(

    "input",

    () => {

      const reading =

        textInput.value;

      const romaji =

        hiraganaToRomaji(

          reading

        );

      const reverseRomaji =

        reverseText(

          romaji

        );

      const converted =

        romajiToReadableHiragana(

          reverseRomaji

        );

      reverseReadingElement

        .textContent =

          converted.text;

      reverseRomajiElement

        .textContent =

          reverseRomaji;

      romajiElement

        .textContent =

          romaji;

      readingElement

        .textContent =

          reading;

      warningElement

        .style

        .display =

          converted.warning

            ? "block"

            : "none";

    }

  );

/* ==================================================

   まとめてコピー

================================================== */

const copyButton =

  document.getElementById(

    "copyAll"

  );

const copyMessage =

  document.getElementById(

    "copyMessage"

  );

let copyTimer =

  null;

copyButton

  .addEventListener(

    "click",

    async () => {

      /*

        空行なし

      */

      const copyText =

`逆順読み方：${reverseReadingElement.textContent}

逆順ローマ字：${reverseRomajiElement.textContent}

ローマ字：${romajiElement.textContent}

読み方：${readingElement.textContent}`;

      let success =

        false;

      /*

        通常のコピー

      */

      try {

        if (

          navigator.clipboard &&

          window.isSecureContext

        ) {

          await navigator

            .clipboard

            .writeText(

              copyText

            );

          success =

            true;

        }

      }

      catch (error) {

        console.error(

          error

        );

      }

      /*

        一部スマホ用

      */

      if (!success) {

        try {

          const temp =

            document.createElement(

              "textarea"

            );

          temp.value =

            copyText;

          temp.setAttribute(

            "readonly",

            ""

          );

          temp.style.position =

            "fixed";

          temp.style.opacity =

            "0";

          document.body

            .appendChild(

              temp

            );

          temp.focus();

          temp.select();

          temp.setSelectionRange(

            0,

            temp.value.length

          );

          success =

            document.execCommand(

              "copy"

            );

          temp.remove();

        }

        catch (error) {

          console.error(

            error

          );

        }

      }

      if (success) {

        copyMessage

          .textContent =

            "コピーしました";

      }

      else {

        copyMessage

          .textContent =

            "コピーできませんでした";

      }

      copyMessage

        .classList

        .add(

          "show"

        );

      if (

        copyTimer

      ) {

        clearTimeout(

          copyTimer

        );

      }

      /*

        3秒後に消す

      */

      copyTimer =

        setTimeout(

          () => {

            copyMessage

              .classList

              .remove(

                "show"

              );

          },

          3000

        );

    }

  );
